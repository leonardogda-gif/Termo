  else if(e.key==="ArrowRight"||e.key==="Tab"){e.preventDefault();step(1);render()}
  else if(e.key==="ArrowLeft"){e.preventDefault();step(-1);render()}
  else{const c=norm(e.key);if(c.length===1)type(c)}
});
document.addEventListener("visibilitychange",()=>{ if(HUB.active!=="cruz"||!G||G.done||view!=="play")return; if(document.visibilityState==="hidden")pause(); else{G.resumed=Date.now()} });
window.addEventListener("resize",()=>{if(HUB.active==="cruz"&&view==="play")render()});

function boot(){
  const s=load();
  if(s){ if(s.pick&&(DICAS[s.pick.theme]||s.pick.theme===ALL)&&SIZES[s.pick.size])pick=s.pick; if(s.G&&s.G.puz)G=s.G; }
  render();
}

return {gen:{buildPuzzle,solution,entriesFor},mount(){ if(!booted){booted=true;boot()} if(view==="play"&&G&&!G.done){G.resumed=Date.now()} render(); }, unmount(){ clearInterval(tick); if(view==="play")pause(); }};
})();
</script>
<script>
window.GAMES=window.GAMES||{};
GAMES.telao=(function(){
const ROOT=document.getElementById("telao");
const SAVE="telao-v1", TEAMSAVE="telao-equipe-v1", PREFIX="termo-telao-lgda-";
const ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const KEYS=["QWERTYUIOP","ASDFGHJKL","EZXCVBNMB"];
const COLORS=["#e2574c","#2f7fd8","#2f9e5a","#e0a12a","#8e5bd6","#d6559a","#1f9fa0","#c46a2d"];
const ICE={iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"}
]};

let view="home", booted=false;
let cfg={n:5,max:6,words:"biblia",dict:true,rounds:5,teams:["Equipe 1","Equipe 2"]};
let S=null;   // partida só no telão
let H=null;   // telão que hospeda a sala (com celulares)
let T=null;   // celular de uma equipe
let cur="", toastT=null, wake=null, showHint=false, backArmed=false, flash=-1, kbOn=null;
let peer=null, conns=[], hconn=null, net="off", retryT=null, beatT=null, openT=null, failures=0, reopenTries=0, lastHeard=0, revealT=null;

/* ---------------- utilidades ---------------- */
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z]/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(){put(SAVE,{cfg,S,H})}
function genCode(){let s="";for(let i=0;i<5;i++)s+=ABC[rnd(ABC.length)];return s}
function genId(){return "e"+Date.now().toString(36)+rnd(1e9).toString(36)}
const tries=k=>`${k} tentativa${k>1?"s":""}`;
const pts=k=>`${k} ponto${k>1?"s":""}`;

/* ---------------- palavras ---------------- */
const BIB={};
for(const [theme,list] of Object.entries(BIBLIA)) for(const w of list.split(" ")){const k=norm(w);if(k&&!BIB[k])BIB[k]={shown:w,theme}}
const _sets={};
function inDict(w){
  const n=w.length;if(n<4||n>8)return false;
  if(!_sets[n]){const s=new Set(),str=DICT[n]||"";for(let i=0;i<str.length;i+=n)s.add(str.slice(i,i+n));_sets[n]=s}
  return _sets[n].has(w);
}
function pool(words,n){return words==="biblia"?Object.keys(BIB).filter(w=>w.length===n):(COMUNS[n]||"").split(" ").filter(Boolean)}
function draw(words,n,avoid){
  const p=pool(words,n),fresh=p.filter(w=>!(avoid||[]).includes(w));
  const from=fresh.length?fresh:p;return from[rnd(from.length)];
}
function shown(w){return BIB[w]?BIB[w].shown.toUpperCase():w}
function themeOf(words,w){return words==="biblia"&&BIB[w]?BIB[w].theme:""}
function score(g,s){
  const r=Array(g.length).fill("absent"),left={};
  for(let i=0;i<g.length;i++){ if(g[i]===s[i]) r[i]="correct"; else left[s[i]]=(left[s[i]]||0)+1; }
  for(let i=0;i<g.length;i++){ if(r[i]!=="correct"&&left[g[i]]>0){r[i]="present";left[g[i]]--;} }
  return r;
}
const isWin=r=>r.every(x=>x==="correct");
// Pontos: quanto menos tentativas, mais pontos. No modo com celulares, quem acerta primeiro ganha +3.
const roundPoints=(max,used,first)=>Math.max(1,max+1-used)+(first?3:0);

/* ---------------- regras: só telão ---------------- */
function localStart(){
  S={teams:cfg.teams.map((name,i)=>({name:name.trim()||`Equipe ${i+1}`,color:COLORS[i%COLORS.length],score:0})),
    n:cfg.n,max:cfg.max,words:cfg.words,dict:cfg.dict,rounds:cfg.rounds,round:0,avoid:[]};
  localRound();
}
function localRound(){
  S.round++;S.secret=draw(S.words,S.n,S.avoid);S.avoid=[S.secret,...S.avoid].slice(0,80);
  S.theme=themeOf(S.words,S.secret);S.guesses=[];S.status="play";S.winner=-1;S.gain=0;
  S.turn=(S.round-1)%S.teams.length;cur="";showHint=false;
}
function localGuess(w){
  const res=score(w,S.secret);S.guesses.push({w,res,team:S.turn});
  if(isWin(res)){S.winner=S.turn;S.gain=roundPoints(S.max,S.guesses.length,false);S.teams[S.turn].score+=S.gain;S.status="reveal";}
  else if(S.guesses.length>=S.max){S.status="reveal";}
  else S.turn=(S.turn+1)%S.teams.length;
}

/* ---------------- regras: telão com celulares (anfitrião) ---------------- */
function hostCreate(){
  H={code:genCode(),n:cfg.n,max:cfg.max,words:cfg.words,dict:cfg.dict,rounds:cfg.rounds,round:0,status:"lobby",teams:{},order:[],avoid:[],secret:"",theme:"",started:0};
}
function hostStartRound(){
  H.round++;H.secret=draw(H.words,H.n,H.avoid);H.avoid=[H.secret,...H.avoid].slice(0,80);H.theme=themeOf(H.words,H.secret);
  H.status="play";H.started=Date.now();
  for(const id of H.order){const t=H.teams[id];t.guesses=[];t.solvedAt=0;t.rank=0;t.gain=0}
}
function hostJoin(tid,name){
  if(!H.teams[tid]){H.teams[tid]={name,color:COLORS[H.order.length%COLORS.length],score:0,guesses:[],solvedAt:0,rank:0,gain:0};H.order.push(tid);return true}
  H.teams[tid].name=name;return false;
}
function hostGuess(tid,round,w){
  const t=H.teams[tid];
  if(!t||H.status!=="play"||round!==H.round||t.solvedAt||t.guesses.length>=H.max) return false;
  w=norm(w);if(w.length!==H.n) return false;
  const res=score(w,H.secret);t.guesses.push({w,res});
  if(isWin(res)){
    const rank=H.order.filter(id=>H.teams[id].solvedAt).length+1;
    t.solvedAt=Date.now();t.rank=rank;t.gain=roundPoints(H.max,t.guesses.length,rank===1);t.score+=t.gain;
  }
  return true;
}
const done=t=>!!t.solvedAt||t.guesses.length>=H.max;
function hostAllDone(){return H.order.length>0&&H.order.every(id=>done(H.teams[id]))}
function ranking(teams,ids){return ids.map(id=>({id,...teams[id]})).sort((a,b)=>b.score-a.score)}
function teamView(tid){
  const t=H.teams[tid];if(!t) return null;
  const showWord=H.status==="reveal"||H.status==="end";
  return {t:"state",code:H.code,round:H.round,rounds:H.rounds,status:H.status,n:H.n,max:H.max,dict:H.dict,
    hint:H.status==="lobby"?"":H.theme,name:t.name,color:t.color,score:t.score,guesses:t.guesses,
    solved:!!t.solvedAt,rank:t.rank,gain:t.gain,word:showWord?shown(H.secret):"",
    board:ranking(H.teams,H.order).map(x=>({name:x.name,color:x.color,score:x.score,me:x.id===tid}))};
}

/* ---------------- rede ---------------- */
function newPeer(id){const o={debug:0,config:ICE};return id?new Peer(id,o):new Peer(o)}
function stopNet(){
  clearTimeout(retryT);clearTimeout(openT);clearInterval(beatT);
  for(const c of conns){try{c.close()}catch(e){}} conns=[];
  try{hconn&&hconn.close()}catch(e){} hconn=null;
  try{peer&&peer.destroy()}catch(e){} peer=null;net="off";
}
// --- anfitrião (a TV) ---
function hostOpen(){
  clearTimeout(retryT);
  if(peer){try{peer.destroy()}catch(e){} peer=null}
  if(typeof Peer==="undefined"){net="nolib";render();return}
  if(!navigator.onLine){net="nointernet";render();return}
  net="opening";render();
  peer=newPeer(PREFIX+H.code);
  peer.on("open",()=>{reopenTries=0;net="ready";render()});
  peer.on("connection",hostWire);
  peer.on("disconnected",()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    const t=e&&e.type;
    if(t==="unavailable-id"){
      reopenTries++;
      if(reopenTries>6&&H.status==="lobby"&&!H.order.length){reopenTries=0;H.code=genCode();save()}
      net="reopening";render();retryT=setTimeout(hostOpen,3000);
    } else if(t!=="peer-unavailable"){net=navigator.onLine?"offline":"nointernet";render();retryT=setTimeout(hostOpen,4000)}
  });
  hostBeat();
}
function hostWire(c){
  c.lastHeard=Date.now();conns.push(c);
  c.on("data",m=>{c.lastHeard=Date.now();if(!m||m.t==="ping")return;hostData(c,m)});
  const gone=()=>{conns=conns.filter(x=>x!==c);if(view.startsWith("h-"))render()};
  c.on("close",gone);c.on("error",gone);
}
function hostBeat(){
  clearInterval(beatT);
  beatT=setInterval(()=>{
    for(const c of conns.slice()){
      if(!c.open) continue;
      try{c.send({t:"ping"})}catch(e){}
      if(Date.now()-c.lastHeard>15000){try{c.close()}catch(e){} conns=conns.filter(x=>x!==c)}
    }
    if(view==="h-play") updateClock();
  },4000);
}
function sendTeam(tid){const v=teamView(tid);if(!v)return;for(const c of conns)if(c.tid===tid&&c.open){try{c.send(v)}catch(e){}}}
function sendAll(){for(const id of H.order)sendTeam(id)}
function hostData(c,m){
  if(!H) return;
  if(m.t==="hello"){
    const tid=String(m.tid||"").slice(0,40),name=String(m.name||"").trim().slice(0,20)||"Equipe";
    if(!tid) return;
    c.tid=tid;const isNew=hostJoin(tid,name);
    if(isNew) toast(`${name} entrou`);
    save();sendAll();render();return;
  }
  if(!c.tid) return;
  if(m.t==="sync"){sendTeam(c.tid);return}
  if(m.t==="guess"){
    if(hostGuess(c.tid,m.round,m.w)){
      const t=H.teams[c.tid];
      if(t.rank===1) toast(`${t.name} acertou primeiro!`);
      save();sendAll();render();
      if(hostAllDone()){clearTimeout(revealT);revealT=setTimeout(hostReveal,1800)}
    } else sendTeam(c.tid);
  }
}
function hostReveal(){if(!H||H.status!=="play")return;clearTimeout(revealT);H.status="reveal";save();sendAll();render()}
function hostNext(){
  if(H.round>=H.rounds){H.status="end"}
  else hostStartRound();
  save();sendAll();render();
}
// --- celular de equipe ---
function teamOpen(){
  clearTimeout(retryT);clearTimeout(openT);
  if(peer){try{peer.destroy()}catch(e){} peer=null}
  if(typeof Peer==="undefined"){net="nolib";render();return}
  if(!navigator.onLine){net="nointernet";render();return}
  net="connecting";render();
  peer=newPeer();
  peer.on("open",teamConnect);
  peer.on("disconnected",()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    const t=e&&e.type;
    if(t==="peer-unavailable") teamFailed("nohost");
    else {net=navigator.onLine?"offline":"nointernet";render();retryT=setTimeout(teamOpen,4000)}
  });
}
function teamConnect(){
  if(!peer||peer.destroyed||!peer.open) return teamOpen();
  clearTimeout(openT);
  const c=peer.connect(PREFIX+T.code,{reliable:true});
  c.on("open",()=>{
    clearTimeout(openT);hconn=c;failures=0;net="online";lastHeard=Date.now();
    c.send({t:"hello",tid:T.tid,name:T.name});teamBeat();render();
  });
  c.on("data",m=>{if(hconn!==c)return;lastHeard=Date.now();if(!m||m.t==="ping")return;if(m.t==="state")teamState(m)});
  const lost=()=>{if(hconn===c||!hconn){hconn=null;clearTimeout(openT);teamFailed("lost")}};
  c.on("close",lost);c.on("error",lost);
  openT=setTimeout(()=>{if(!c.open){try{c.close()}catch(e){} teamFailed("stuck")}},12000);
}
function teamFailed(kind){
  failures++;
  if(failures>=4){net=kind==="nohost"?"givenohost":"giveup";render();return}
  net=kind==="nohost"?"nohost":"lost";render();
  clearTimeout(retryT);retryT=setTimeout(()=>{if(hconn&&hconn.open)return;if(peer&&peer.open&&!peer.destroyed)teamConnect();else teamOpen()},2500);
}
function teamBeat(){
  clearInterval(beatT);
  beatT=setInterval(()=>{
    if(!hconn||!hconn.open) return;
    try{hconn.send({t:"ping"})}catch(e){}
    if(Date.now()-lastHeard>15000){const c=hconn;hconn=null;try{c.close()}catch(e){} teamFailed("lost")}
  },4000);
}
function teamState(m){
  const newRound=!T.st||T.st.round!==m.round||(T.st.status!==m.status&&m.status==="play");
  const before=T.st?T.st.guesses.length:0;
  T.st=m;T.name=m.name;
  if(newRound){cur="";T.pending=false;showHint=false;flash=-1}
  if(m.guesses.length>before){T.pending=false;flash=m.guesses.length-1}
  if(T.pending&&m.guesses.length===before&&T.sentAt&&Date.now()-T.sentAt>400) T.pending=false;
  view=m.status==="lobby"?"t-lobby":m.status==="play"?"t-play":m.status==="reveal"?"t-reveal":"t-end";
  if(m.status==="play"&&m.solved&&before<m.guesses.length) toast(`Acertou! +${pts(m.gain)}`);
  keepAwake();render();
}
document.addEventListener("visibilitychange",()=>{
  if(HUB.active!=="telao"||document.visibilityState!=="visible") return;
  if(peer&&peer.disconnected&&!peer.destroyed){try{peer.reconnect()}catch(e){}}
  if(T&&view.startsWith("t-")){ if(hconn&&hconn.open){try{hconn.send({t:"sync"})}catch(e){}} else {failures=0;teamFailed("lost")} }
  if(H&&view.startsWith("h-")&&(!peer||peer.destroyed)) hostOpen();
  keepAwake();
});
async function keepAwake(){
  const need=["l-play","l-reveal","h-lobby","h-play","h-reveal","t-lobby","t-play","t-reveal"].includes(view);
  try{if(need&&"wakeLock" in navigator&&!wake&&document.visibilityState==="visible"){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}
}

/* ---------------- peças de tela ---------------- */
function tileRow(word,res,n,{anim=false,cursor=-1,pending=false,blank=false,who=""}={}){
  let h="";
  for(let i=0;i<n;i++){
    const ch=blank?"":(word[i]||"");
    const st=res?res[i]:(pending?"pending":(ch?"filled":""));
    h+=`<div class="tile ${st} ${anim?"flip":""} ${i===cursor?"cursor":""}"${anim?` style="animation-delay:${i*0.12}s"`:""}>${esc(ch)}</div>`;
  }
  return `<div class="trow">${who?`<span class="who" style="background:${who}"></span>`:""}<div class="row" style="--n:${n}">${h}</div></div>`;
}
function kbStates(guesses){
  const m={},rank={absent:1,present:2,correct:3};
  for(const g of guesses) g.res.forEach((x,i)=>{const k=g.w[i];if(!m[k]||rank[x]>rank[m[k]])m[k]=x});
  return m;
}
function keyboard(states,on){
  return `<div class="kb ${on?"":"off"}">`+KEYS.map((row,ri)=>`<div class="kr">`+[...row].map((k,ki)=>{
    if(ri===2&&ki===0) return `<button class="key wide" data-k="ENTER">ENVIAR</button>`;
    if(ri===2&&ki===row.length-1) return `<button class="key wide" data-k="BACK" aria-label="Apagar">⌫</button>`;
    return `<button class="key ${states[k]||""}" data-k="${k}">${k}</button>`;
  }).join("")+`</div>`).join("")+`</div>`;
}
function tileSize(n,max,{wide,withKb}){
  const W=Math.min(window.innerWidth-32,1500)*(wide?0.6:1);
  const Hh=window.innerHeight-(withKb?(wide?330:300):150)-(wide?60:110);
  return Math.max(26,Math.min(110,Math.floor(Math.min((W-(n-1)*8)/n,(Hh-(max-1)*8)/max))));
}
function netLine(){
  const m={opening:"Abrindo a sala…",reopening:"Reabrindo a sala…",offline:"Sem conexão com o servidor. Tentando de novo…",nointernet:"Sem internet neste aparelho.",
    nolib:"Não consegui carregar a parte de conexão. Verifique a internet e recarregue a página.",connecting:"Conectando…",lost:"A conexão caiu. Reconectando…",nohost:"Procurando a sala…"};
  if(net==="giveup"||net==="givenohost") return `<div class="net">${net==="givenohost"?"Não achei a sala. Confira se o telão está com a sala aberta.":"Não consegui conectar nesta rede."} <button class="mini-btn" data-act="retry">Tentar de novo</button></div>`;
  return m[net]?`<div class="net">${m[net]}</div>`:"";
}
function backBtn(){return `<button class="back ${backArmed?"armed":""}" data-act="back" aria-label="Sair">${backArmed?"Sair?":"←"}</button>`}
function scoreList(list,{big=false}={}){
  return `<ol class="scores ${big?"big":""}">${list.map((t,i)=>`<li style="--c:${t.color}" class="${t.me?"me":""}"><span class="pos">${i+1}º</span><span class="nm">${esc(t.name)}${t.me?" (vocês)":""}</span><b>${t.score}</b></li>`).join("")}</ol>`;
}
function fsBtn(){return document.fullscreenEnabled?`<button class="mini-btn" data-act="fs">${document.fullscreenElement?"Sair da tela cheia":"Tela cheia"}</button>`:""}

/* ---------------- telas ---------------- */
function render(){
  const v={home:vHome,teams:vTeams,"l-play":vLocalPlay,"l-reveal":vLocalReveal,"l-end":vLocalEnd,
    "h-lobby":vHostLobby,"h-play":vHostPlay,"h-reveal":vHostReveal,"h-end":vHostEnd,
    "t-join":vTeamJoin,"t-wait":vTeamWait,"t-lobby":vTeamLobby,"t-play":vTeamPlay,"t-reveal":vTeamReveal,"t-end":vTeamEnd}[view]||vHome;
  ROOT.innerHTML=v();
  ROOT.dataset.view=view;
  if(view==="h-lobby") drawQR();
  flash=-1;
}
function chips(arr,val,act){return arr.map(v=>`<button class="chip" data-act="${act}" data-v="${v}" aria-pressed="${v===val}">${v}</button>`).join("")}
function vHome(){
  const resumeL=S&&S.status!=="end", resumeH=H&&H.status!=="end";
  return `<div class="scroll narrow">
    <button class="tohub" data-act="hub">← Termo</button>
    <div class="hero"><h1 class="brand">Termo no Telão<span>Para jogar em equipes, com o tabuleiro grande na TV.</span></h1></div>
    ${resumeL?`<button class="cta resume" data-act="resumeL">Continuar partida no telão · rodada ${S.round} de ${S.rounds}</button>`:""}
    ${resumeH?`<button class="cta resume" data-act="resumeH">Voltar para a sala ${esc(H.code)}</button>`:""}
    <div class="settings">
      <div class="field"><span class="label">Letras da palavra</span><div class="chips">${chips([4,5,6,7,8],cfg.n,"n")}</div></div>
      <div class="field"><span class="label">Tentativas</span><div class="chips">${chips([4,5,6,7,8],cfg.max,"max")}</div></div>
      <div class="field"><span class="label">Rodadas</span><div class="chips">${chips([3,5,7,10],cfg.rounds,"rounds")}</div></div>
      <div class="field"><span class="label">Tipo de palavra</span><div class="seg2">
        <button data-act="words" data-v="biblia" aria-pressed="${cfg.words==="biblia"}">Bíblicas</button><button data-act="words" data-v="comuns" aria-pressed="${cfg.words==="comuns"}">Comuns</button></div></div>
      <label class="switch"><span>Só palavras do dicionário<small>Desligue para aceitar qualquer palavra</small></span><input type="checkbox" id="tl-dict" ${cfg.dict?"checked":""}></label>
    </div>
    <div class="modes">
      <button class="mode" data-act="local">
        <b>Só o telão</b><span>As equipes se revezam no mesmo tabuleiro. Quem manda digita no notebook ou na tela. Não precisa de internet.</span>
      </button>
      <button class="mode" data-act="host">
        <b>Telão + celulares</b><span>Cada equipe joga no seu celular, todas ao mesmo tempo. A TV mostra o andamento de cada uma, só com as cores.</span>
      </button>
    </div>
  </div>`;
}
function vTeams(){
  return `<div class="scroll narrow">
    <button class="tohub" data-act="home">← Voltar</button>
    <div class="hero"><h1 class="brand">Equipes<span>De 2 a 6 equipes. Elas se revezam a cada palpite.</span></h1></div>
    <div class="teamlist">${cfg.teams.map((t,i)=>`<div class="teamrow" style="--c:${COLORS[i%COLORS.length]}"><span class="sw"></span>
      <input class="text" id="tl-team-${i}" maxlength="20" value="${esc(t)}" aria-label="Nome da equipe ${i+1}">
      ${cfg.teams.length>2?`<button class="mini-btn" data-act="delteam" data-v="${i}" aria-label="Remover">✕</button>`:""}</div>`).join("")}</div>
    ${cfg.teams.length<6?`<button class="ghost" data-act="addteam">+ Adicionar equipe</button>`:""}
    <button class="cta" data-act="startlocal">Começar</button>
  </div>`;
}
function wide(){return window.innerWidth>=900}
function vLocalPlay(){
  const W=wide(), useKb=kbOn===null?matchMedia("(pointer:coarse)").matches||!W:kbOn;
  const ts=tileSize(S.n,S.max,{wide:W,withKb:useKb});
  const team=S.teams[S.turn];
  let rows="";
  S.guesses.forEach((g,i)=>rows+=tileRow(g.w,g.res,S.n,{anim:i===flash,who:S.teams[g.team].color}));
  if(S.guesses.length<S.max) rows+=`<div data-active>${tileRow(cur,null,S.n,{cursor:cur.length<S.n?cur.length:-1,who:team.color})}</div>`;
  for(let i=S.guesses.length+1;i<S.max;i++) rows+=tileRow("",null,S.n,{who:"transparent"});
  const side=`<div class="side">
      <div class="turn" style="--c:${team.color}"><span class="label">Vez de</span><b>${esc(team.name)}</b></div>
      ${S.theme?(showHint?`<div class="hint-box">Dica: ${esc(S.theme)}</div>`:`<button class="ghost" data-act="hint">Mostrar dica</button>`):""}
      ${scoreList(S.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score))}
      <div class="tools"><button class="mini-btn" data-act="pass">Passar a vez</button><button class="mini-btn" data-act="kb">${useKb?"Esconder teclado":"Teclado na tela"}</button>${fsBtn()}<button class="mini-btn" data-act="endlocal">Encerrar</button></div>
    </div>`;
  return `<div class="tv ${W?"wide":""}">
    <div class="tvtop">${backBtn()}<span class="label">Rodada ${S.round} de ${S.rounds} · ${S.n} letras · ${S.guesses.length}/${S.max}</span></div>
    <div class="tvbody">
      <div class="boardcol"><div class="bigboard" style="--ts:${ts}px">${rows}</div>${useKb?keyboard(kbStates(S.guesses),true):`<p class="hint center">Digite no teclado e aperte Enter.</p>`}</div>
      ${side}
    </div>
  </div>`;
}
function vLocalReveal(){
  const won=S.winner>=0, t=won?S.teams[S.winner]:null, last=S.round>=S.rounds;
  return `<div class="tv wide reveal">
    <div class="tvtop">${backBtn()}<span class="label">Rodada ${S.round} de ${S.rounds}</span></div>
    <div class="revealbox">
      <span class="label">A palavra era</span>
      <p class="word">${esc(shown(S.secret))}</p>
      ${S.theme?`<p class="theme">${esc(S.theme)}</p>`:""}
      <p class="verdict" ${won?`style="--c:${t.color}"`:""}>${won?`<b>${esc(t.name)}</b> acertou em ${tries(S.guesses.length)} e ganhou ${pts(S.gain)}!`:"Ninguém acertou desta vez."}</p>
      ${scoreList(S.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score),{big:true})}
      <button class="cta" data-act="${last?"finishlocal":"nextlocal"}">${last?"Ver resultado final":"Próxima rodada"}</button>
    </div>
  </div>`;
}
function podium(list){
  const top=list[0], tie=list.length>1&&list[1].score===top.score;
  return `<div class="revealbox">
    <span class="label">Resultado final</span>
    <p class="word">${tie?"Empate!":esc(top.name)}</p>
    <p class="verdict">${tie?"Mais de uma equipe terminou com a mesma pontuação.":`venceu com ${pts(top.score)}!`}</p>
    ${scoreList(list,{big:true})}`;
}
function vLocalEnd(){
  return `<div class="tv wide reveal"><div class="tvtop">${backBtn()}</div>
    ${podium(S.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score))}
    <button class="cta" data-act="againlocal">Jogar de novo com as mesmas equipes</button>
    <button class="ghost" data-act="home">Voltar ao início</button></div></div>`;
}
/* --- anfitrião --- */
function joinURL(){return location.href.split(/[?#]/)[0]+"?tv="+H.code}
function drawQR(){
  const el=ROOT.querySelector("#tl-qr");if(!el||typeof QRCode==="undefined")return;
  el.innerHTML="";new QRCode(el,{text:joinURL(),width:520,height:520,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function teamChips(){
  if(!H.order.length) return `<p class="hint center">Nenhuma equipe ainda.</p>`;
  return `<div class="joined">${H.order.map(id=>{const t=H.teams[id],on=conns.some(c=>c.tid===id&&c.open);return `<span class="jt ${on?"":"off"}" style="--c:${t.color}">${esc(t.name)}</span>`}).join("")}</div>`;
}
function vHostLobby(){
  return `<div class="tv wide">
    <div class="tvtop">${backBtn()}<span class="label">Telão + celulares · ${H.n} letras · ${H.max} tentativas · ${H.rounds} rodadas</span>${fsBtn()}</div>
    <div class="lobby2">
      <div class="qrcol"><div class="qr" id="tl-qr" role="img" aria-label="QR code da sala"></div>
        <p class="code">${esc(H.code)}</p><p class="hint center">Cada equipe lê o QR com a câmera do celular.</p></div>
      <div class="lobbyside">
        ${netLine()||(net==="ready"?`<div class="ok-line">Sala aberta. Esperando as equipes…</div>`:"")}
        <span class="label">Equipes na sala</span>
        ${teamChips()}
        <button class="cta" data-act="hoststart" ${H.order.length?"":"disabled"}>Começar a primeira rodada</button>
        <p class="hint">Deixe esta tela aberta. Quem entrar depois do começo também joga.</p>
      </div>
    </div>
  </div>`;
}
function clockText(){const s=Math.max(0,Math.floor((Date.now()-H.started)/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function updateClock(){const el=ROOT.querySelector("#tl-clock");if(el)el.textContent=clockText()}
function hostCard(id){
  const t=H.teams[id],on=conns.some(c=>c.tid===id&&c.open);
  let rows="";
  for(let i=0;i<H.max;i++){const g=t.guesses[i];rows+=`<div class="mrow" style="--n:${H.n}">${Array.from({length:H.n},(_,j)=>`<i class="${g?g.res[j]:""}"></i>`).join("")}</div>`}
  const st=t.solvedAt?`<span class="badge ok">${t.rank}º · acertou em ${t.guesses.length}</span>`:t.guesses.length>=H.max?`<span class="badge">sem tentativas</span>`:`<span class="badge live">${t.guesses.length}/${H.max}</span>`;
  return `<div class="tcard ${t.solvedAt?"won":""}" style="--c:${t.color}">
    <div class="th"><b>${esc(t.name)}</b>${on?"":`<span class="off-dot" title="desconectado">•</span>`}<span class="sc">${t.score}</span></div>
    <div class="mini">${rows}</div>${st}</div>`;
}
function vHostPlay(){
  return `<div class="tv wide">
    <div class="tvtop">${backBtn()}<span class="label">Rodada ${H.round} de ${H.rounds} · ${H.n} letras</span>
      <span class="clock" id="tl-clock">${clockText()}</span>${fsBtn()}<button class="mini-btn" data-act="hostreveal">Encerrar rodada</button></div>
    ${netLine()}
    ${H.theme?`<div class="hint-box center">Dica: ${esc(H.theme)}</div>`:""}
    <div class="tcards">${H.order.map(hostCard).join("")}</div>
    <p class="hint center">Para entrar agora: ${esc(joinURL().replace(/^https?:\/\//,""))}</p>
  </div>`;
}
function vHostReveal(){
  const winners=H.order.map(id=>({id,...H.teams[id]})).filter(t=>t.solvedAt).sort((a,b)=>a.rank-b.rank);
  const last=H.round>=H.rounds;
  return `<div class="tv wide reveal"><div class="tvtop">${backBtn()}<span class="label">Rodada ${H.round} de ${H.rounds}</span>${fsBtn()}</div>
    <div class="revealbox">
      <span class="label">A palavra era</span><p class="word">${esc(shown(H.secret))}</p>
      ${H.theme?`<p class="theme">${esc(H.theme)}</p>`:""}
      ${winners.length?`<ol class="winners">${winners.map(t=>`<li style="--c:${t.color}"><b>${esc(t.name)}</b> · ${tries(t.guesses.length)} · +${pts(t.gain)}</li>`).join("")}</ol>`:`<p class="verdict">Nenhuma equipe acertou desta vez.</p>`}
      ${scoreList(ranking(H.teams,H.order),{big:true})}
      <button class="cta" data-act="hostnext">${last?"Ver resultado final":"Próxima rodada"}</button>
    </div></div>`;
}
function vHostEnd(){
  return `<div class="tv wide reveal"><div class="tvtop">${backBtn()}${fsBtn()}</div>
    ${podium(ranking(H.teams,H.order))}
    <button class="cta" data-act="hostagain">Jogar de novo com as mesmas equipes</button>
    <button class="ghost" data-act="hostclose">Fechar a sala</button></div></div>`;
}
/* --- celular da equipe --- */
function vTeamJoin(){
  const p=get(TEAMSAVE)||{};
  return `<div class="scroll narrow" style="justify-content:center">
    <div class="hero"><h1 class="brand">Termo no Telão<span>Sala <b class="codeinline">${esc(T.code)}</b></span></h1></div>
    <div class="field"><label class="label" for="tl-name">Nome da equipe</label>
      <input class="text" id="tl-name" maxlength="20" placeholder="Ex.: Leões de Judá" value="${esc(T.name||p.name||"")}" autocomplete="off"></div>
    <button class="cta" data-act="teamjoin">Entrar na sala</button>
    <button class="ghost" data-act="teamcancel">Voltar aos jogos</button>
  </div>`;
}
function vTeamWait(){
  return `<div class="scroll narrow" style="justify-content:center;text-align:center">
    <p class="code">${esc(T.code)}</p>
    ${netLine()||`<div class="wait"><span class="spin"></span>Entrando na sala…</div>`}
    <p class="hint">O telão precisa estar com a sala aberta.</p>
    <button class="ghost" data-act="teamcancel">Cancelar</button></div>`;
}
function teamHead(){
  const m=T.st;
  return `<div class="tvtop">${backBtn()}<span class="tname" style="--c:${m.color}"><i></i>${esc(m.name)}</span><span class="sc">${m.score} ${m.score===1?"pt":"pts"}</span></div>${netLine()}`;
}
function vTeamLobby(){
  return `<div class="col">${teamHead()}<div class="center-box">
    <span class="label">Vocês estão na sala!</span><p class="word sm">Olhem para o telão</p>
    <p class="hint">O jogo começa quando o telão iniciar a rodada.</p></div></div>`;
}
function vTeamPlay(){
  const m=T.st, k=m.guesses.length, outOf=k>=m.max;
  const active=!m.solved&&!outOf;
  const ts=tileSize(m.n,m.max,{wide:false,withKb:true});
  let rows="";
  m.guesses.forEach((g,i)=>rows+=tileRow(g.w,g.res,m.n,{anim:i===flash}));
  if(active) rows+=`<div data-active>${tileRow(cur,null,m.n,{cursor:!T.pending&&cur.length<m.n?cur.length:-1,pending:T.pending})}</div>`;
  for(let i=k+(active?1:0);i<m.max;i++) rows+=tileRow("",null,m.n);
  const msg=m.solved?`Acertaram! +${pts(m.gain)}. Olhem o telão.`:outOf?"Acabaram as tentativas. Esperem a rodada terminar.":T.pending?"Conferindo…":`Rodada ${m.round} de ${m.rounds} · tentativa ${k+1} de ${m.max}`;
  return `<div class="col">${teamHead()}
    <div class="prompt">${msg}${m.hint?`<small>Dica: ${esc(m.hint)}</small>`:""}</div>
    <div class="phoneboard" style="--ts:${ts}px">${rows}</div>
    ${keyboard(kbStates(m.guesses),active&&!T.pending&&!!hconn)}
  </div>`;
}
function vTeamReveal(){
  const m=T.st;
  return `<div class="col">${teamHead()}<div class="center-box">
    <span class="label">A palavra era</span><p class="word">${esc(m.word)}</p>
    ${m.hint?`<p class="theme">${esc(m.hint)}</p>`:""}
    <p class="verdict">${m.solved?`Vocês acertaram e ganharam ${pts(m.gain)}!`:"Não foi desta vez."}</p>
    ${scoreList(m.board)}
    <p class="hint">A próxima rodada começa pelo telão.</p></div></div>`;
}
function vTeamEnd(){
  const m=T.st,pos=m.board.findIndex(b=>b.me)+1;
  return `<div class="col">${teamHead()}<div class="center-box">
    <span class="label">Fim de jogo</span><p class="word">${pos}º lugar</p>
    <p class="verdict">Vocês fizeram ${pts(m.score)}.</p>${scoreList(m.board)}
    <button class="ghost" data-act="teamcancel">Voltar aos jogos</button></div></div>`;
}

/* ---------------- ações ---------------- */
function shake(){const r=ROOT.querySelector("[data-active]");if(r){r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake")}}
function readTeams(){cfg.teams=cfg.teams.map((t,i)=>{const el=ROOT.querySelector("#tl-team-"+i);return el?el.value:t})}
function typing(){
  if(view==="l-play") return S.status==="play";
  if(view==="t-play") return T&&T.st&&!T.st.solved&&T.st.guesses.length<T.st.max&&!T.pending&&!!hconn;
  return false;
}
function press(k){
  if(!typing()) return;
  const n=view==="l-play"?S.n:T.st.n, dict=view==="l-play"?S.dict:T.st.dict;
  if(k==="BACK"){cur=cur.slice(0,-1);render();return}
  if(k==="ENTER"){
    if(cur.length<n){shake();toast(`A palavra precisa ter ${n} letras`);return}
    if(dict&&!inDict(cur)){shake();toast("Essa palavra não está na lista");return}
    if(view==="l-play"){
      localGuess(cur);cur="";flash=S.guesses.length-1;save();
      if(S.status==="reveal"){render();setTimeout(()=>{view="l-reveal";render()},1400)} else render();
    } else {
      T.pending=true;T.sentAt=Date.now();
      try{hconn.send({t:"guess",round:T.st.round,w:cur})}catch(e){T.pending=false}
      setTimeout(()=>{if(T&&T.pending&&Date.now()-T.sentAt>=3000){T.pending=false;try{hconn&&hconn.send({t:"sync"})}catch(e){} render()}},3100);
      cur="";render();
    }
    return;
  }
  if(/^[A-Z]$/.test(k)&&cur.length<n){cur+=k;render()}
}
function act(x,v){
  if(x!=="back") backArmed=false;
  const dictEl=ROOT.querySelector("#tl-dict"); if(dictEl) cfg.dict=dictEl.checked;
  switch(x){
    case "hub": HUB.go("termo"); break;
    case "home": if(view==="teams")readTeams(); view="home"; save(); render(); break;
    case "n": cfg.n=+v; save(); render(); break;
    case "max": cfg.max=+v; save(); render(); break;
    case "rounds": cfg.rounds=+v; save(); render(); break;
    case "words": cfg.words=v; save(); render(); break;
    case "local": view="teams"; render(); break;
    case "addteam": readTeams(); if(cfg.teams.length<6) cfg.teams.push(`Equipe ${cfg.teams.length+1}`); render(); break;
    case "delteam": readTeams(); cfg.teams.splice(+v,1); render(); break;
    case "startlocal": readTeams(); localStart(); view="l-play"; save(); keepAwake(); render(); break;
    case "resumeL": view=S.status==="reveal"?"l-reveal":"l-play"; keepAwake(); render(); break;
    case "hint": showHint=true; render(); break;
    case "pass": if(S&&S.status==="play"){S.turn=(S.turn+1)%S.teams.length;cur="";save();render()} break;
    case "kb": kbOn=!(kbOn===null?(matchMedia("(pointer:coarse)").matches||!wide()):kbOn); render(); break;
    case "nextlocal": localRound(); view="l-play"; save(); render(); break;
    case "finishlocal": case "endlocal": S.status="end"; view="l-end"; save(); render(); break;
    case "againlocal": S.teams.forEach(t=>t.score=0); S.round=0; localRound(); view="l-play"; save(); render(); break;
    case "fs": if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else document.documentElement.requestFullscreen().catch(()=>{}); setTimeout(render,300); break;
    case "host": hostCreate(); view="h-lobby"; save(); hostOpen(); keepAwake(); break;
    case "resumeH": view=H.status==="lobby"?"h-lobby":"h-"+H.status; hostOpen(); keepAwake(); render(); break;
    case "hoststart": hostStartRound(); view="h-play"; save(); sendAll(); render(); break;
    case "hostreveal": hostReveal(); view="h-reveal"; render(); break;
    case "hostnext": hostNext(); view="h-"+H.status; render(); break;
    case "hostagain": for(const id of H.order)H.teams[id].score=0; H.round=0; hostStartRound(); view="h-play"; save(); sendAll(); render(); break;
    case "hostclose": stopNet(); H=null; save(); view="home"; render(); break;
    case "teamjoin":{
      const name=(ROOT.querySelector("#tl-name")||{}).value||"";
      if(!name.trim()){toast("Escreva o nome da equipe");return}
      T.name=name.trim().slice(0,20); put(TEAMSAVE,{code:T.code,tid:T.tid,name:T.name});
      failures=0; view="t-wait"; teamOpen(); keepAwake(); break;}
    case "teamcancel": stopNet(); T=null; try{history.replaceState(null,"",location.pathname)}catch(e){} view="home"; HUB.go("hub"); break;
    case "retry": failures=0; if(T) teamOpen(); else if(H) hostOpen(); break;
    case "back":
      if(!backArmed){backArmed=true;render();setTimeout(()=>{if(backArmed){backArmed=false;render()}},3000);break}
      backArmed=false;
      if(view.startsWith("t-")){act("teamcancel");break}
      if(view.startsWith("h-")){stopNet();view="home";render();break}   // a sala fica guardada para voltar
      view="home";render();break;
  }
  // a TV redesenha quando o estado da sala muda por ação local
  if(H&&view==="h-"+H.status) {}
}
ROOT.addEventListener("click",e=>{
  const k=e.target.closest("[data-k]");if(k){press(k.dataset.k);return}
  const a=e.target.closest("[data-act]");if(a)act(a.dataset.act,a.dataset.v);
});
document.addEventListener("keydown",e=>{
  if(HUB.active!=="telao"||e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="Enter"){e.preventDefault();press("ENTER")}
  else if(e.key==="Backspace"){e.preventDefault();press("BACK")}
  else{const c=norm(e.key);if(c.length===1)press(c)}
});
ROOT.addEventListener("keydown",e=>{
  if(e.target.id==="tl-name"&&e.key==="Enter"){e.preventDefault();act("teamjoin")}
});
window.addEventListener("resize",()=>{if(HUB.active==="telao"&&/play/.test(view))render()});
// quando a TV hospeda, o estado da sala decide a tela
function syncHostView(){if(H&&view.startsWith("h-")&&view!=="h-"+H.status)view="h-"+H.status}
const _render=render; render=function(){syncHostView();_render()};

return {
  mount(){
    if(!booted){
      booted=true;
      const s=get(SAVE);
      if(s){if(s.cfg)cfg=Object.assign(cfg,s.cfg);if(s.S&&s.S.teams)S=s.S;if(s.H&&s.H.code)H=s.H}
      const code=norm(new URLSearchParams(location.search).get("tv")).slice(0,5);
      if(code.length===5){
        const p=get(TEAMSAVE);
        T={code,tid:(p&&p.tid)||genId(),name:(p&&p.code===code&&p.name)||"",st:null,pending:false};
        if(p&&p.code===code&&p.name){view="t-wait";render();teamOpen();return}
        view="t-join";
      }
    }
    render();
  },
  unmount(){},
  _test:{localStart,localGuess,localRound,hostCreate,hostJoin,hostStartRound,hostGuess,hostAllDone,teamView,roundPoints,
    get S(){return S},get H(){return H},set cfg(v){cfg=v},score,draw,inDict,
    show(v){view=v;render()},team(code,m){T={code,tid:'x',name:m.name,st:null,pending:false};hconn={open:true,send(){}};teamState(m)}}
};
})();

</script>
<script>
// Peças comuns dos jogos de equipe no telão: conexão TV ⇄ celulares, telas de sala e placar.
window.TVKIT=(function(){
const ICE={iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"}
]};
const COLORS=["#e2574c","#2f7fd8","#2f9e5a","#e0a12a","#8e5bd6","#d6559a","#1f9fa0","#c46a2d"];
const ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const KEYS=["QWERTYUIOP","ASDFGHJKL","EZXCVBNMB"];
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z]/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function genCode(){let s="";for(let i=0;i<5;i++)s+=ABC[rnd(ABC.length)];return s}
function genId(){return "e"+Date.now().toString(36)+rnd(1e9).toString(36)}
function newPeer(id){const o={debug:0,config:ICE};return id?new Peer(id,o):new Peer(o)}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
let toastT=null;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
const pts=k=>`${k} ponto${k>1?"s":""}`;

/* ---- TV (anfitrião): abre a sala e recebe as equipes ---- */
function host({prefix,code,onData,onChange,canRecode}){
  const o={code,conns:[],net:"opening",peer:null,dead:false};
  let retryT=null,beatT=null,tries=0;
  function open(){
    clearTimeout(retryT);
    if(o.peer){try{o.peer.destroy()}catch(e){} o.peer=null}
    if(o.dead) return;
    if(typeof Peer==="undefined"){o.net="nolib";onChange();return}
    if(!navigator.onLine){o.net="nointernet";onChange();return}
    o.net="opening";onChange();
    const p=o.peer=newPeer(prefix+o.code);
    p.on("open",()=>{tries=0;o.net="ready";onChange()});
    p.on("connection",wire);
    p.on("disconnected",()=>{try{if(!p.destroyed)p.reconnect()}catch(e){}});
    p.on("error",e=>{
      const t=e&&e.type;
      if(t==="unavailable-id"){
        tries++;
        if(tries>6&&canRecode&&canRecode()){tries=0;o.code=genCode()}
        o.net="reopening";onChange();retryT=setTimeout(open,3000);
      } else if(t!=="peer-unavailable"){o.net=navigator.onLine?"offline":"nointernet";onChange();retryT=setTimeout(open,4000)}
    });
    clearInterval(beatT);
    beatT=setInterval(()=>{
      for(const c of o.conns.slice()){
        if(!c.open) continue;
        try{c.send({t:"ping"})}catch(e){}
        if(Date.now()-c.lastHeard>15000){try{c.close()}catch(e){} o.conns=o.conns.filter(x=>x!==c);onChange()}
      }
    },4000);
  }
  function wire(c){
    c.lastHeard=Date.now();o.conns.push(c);
    c.on("data",m=>{c.lastHeard=Date.now();if(!m||m.t==="ping")return;onData(c,m)});
    const gone=()=>{o.conns=o.conns.filter(x=>x!==c);onChange()};
    c.on("close",gone);c.on("error",gone);
  }
  o.sendTo=(tid,msg)=>{for(const c of o.conns)if(c.tid===tid&&c.open){try{c.send(msg)}catch(e){}}};
  o.online=tid=>o.conns.some(c=>c.tid===tid&&c.open);
  o.revive=()=>{if(o.peer&&o.peer.disconnected&&!o.peer.destroyed){try{o.peer.reconnect()}catch(e){}} else if(!o.peer||o.peer.destroyed) open()};
  o.retry=()=>{tries=0;open()};
  o.close=()=>{o.dead=true;clearTimeout(retryT);clearInterval(beatT);for(const c of o.conns){try{c.close()}catch(e){}} o.conns=[];try{o.peer&&o.peer.destroy()}catch(e){} o.peer=null;o.net="off"};
  open();
  return o;
}

/* ---- celular da equipe: entra na sala e recebe o estado ---- */
function team({prefix,code,tid,name,onState,onChange}){
  const o={net:"connecting",conn:null,peer:null,dead:false};
  let retryT=null,openT=null,beatT=null,failures=0,lastHeard=0;
  function open(){
    clearTimeout(retryT);clearTimeout(openT);
    if(o.peer){try{o.peer.destroy()}catch(e){} o.peer=null}
    if(o.dead) return;
    if(typeof Peer==="undefined"){o.net="nolib";onChange();return}
    if(!navigator.onLine){o.net="nointernet";onChange();return}
    o.net="connecting";onChange();
    const p=o.peer=newPeer();
    p.on("open",connect);
    p.on("disconnected",()=>{try{if(!p.destroyed)p.reconnect()}catch(e){}});
    p.on("error",e=>{
      const t=e&&e.type;
      if(t==="peer-unavailable") failed("nohost");
      else {o.net=navigator.onLine?"offline":"nointernet";onChange();retryT=setTimeout(open,4000)}
    });
  }
  function connect(){
    if(o.dead) return;
    if(!o.peer||o.peer.destroyed||!o.peer.open) return open();
    clearTimeout(openT);
    const c=o.peer.connect(prefix+code,{reliable:true});
    c.on("open",()=>{
      clearTimeout(openT);o.conn=c;failures=0;o.net="online";lastHeard=Date.now();
      c.send({t:"hello",tid,name:o.name||name});beat();onChange();
    });
    c.on("data",m=>{if(o.conn!==c)return;lastHeard=Date.now();if(!m||m.t==="ping")return;onState(m)});
    const lost=()=>{if(o.conn===c||!o.conn){o.conn=null;clearTimeout(openT);failed("lost")}};
    c.on("close",lost);c.on("error",lost);
    openT=setTimeout(()=>{if(!c.open){try{c.close()}catch(e){} failed("stuck")}},12000);
  }
  function failed(kind){
    if(o.dead) return;
    failures++;
    if(failures>=4){o.net=kind==="nohost"?"givenohost":"giveup";onChange();return}
    o.net=kind==="nohost"?"nohost":"lost";onChange();
    clearTimeout(retryT);retryT=setTimeout(()=>{if(o.conn&&o.conn.open)return;if(o.peer&&o.peer.open&&!o.peer.destroyed)connect();else open()},2500);
  }
  function beat(){
    clearInterval(beatT);
    beatT=setInterval(()=>{
      if(!o.conn||!o.conn.open) return;
      try{o.conn.send({t:"ping"})}catch(e){}
      if(Date.now()-lastHeard>15000){const c=o.conn;o.conn=null;try{c.close()}catch(e){} failed("lost")}
    },4000);
  }
  o.send=m=>{if(o.conn&&o.conn.open){try{o.conn.send(m);return true}catch(e){}}return false};
  o.retry=()=>{failures=0;open()};
  o.revive=()=>{if(o.peer&&o.peer.disconnected&&!o.peer.destroyed){try{o.peer.reconnect()}catch(e){}} if(o.conn&&o.conn.open)o.send({t:"sync"});else{failures=0;failed("lost")}};
  o.close=()=>{o.dead=true;clearTimeout(retryT);clearTimeout(openT);clearInterval(beatT);try{o.conn&&o.conn.close()}catch(e){} try{o.peer&&o.peer.destroy()}catch(e){} o.conn=null;o.peer=null;o.net="off"};
  o.name=name;
  open();
  return o;
}

/* ---- pedaços de tela ---- */
function netLine(net){
  const m={opening:"Abrindo a sala…",reopening:"Reabrindo a sala…",offline:"Sem conexão com o servidor. Tentando de novo…",nointernet:"Sem internet neste aparelho.",
    nolib:"Não consegui carregar a parte de conexão. Verifique a internet e recarregue a página.",connecting:"Conectando…",lost:"A conexão caiu. Reconectando…",nohost:"Procurando a sala…"};
  if(net==="giveup"||net==="givenohost") return `<div class="net">${net==="givenohost"?"Não achei a sala. Confira se o telão está com a sala aberta.":"Não consegui conectar nesta rede."} <button class="mini-btn" data-act="retry">Tentar de novo</button></div>`;
  return m[net]?`<div class="net">${m[net]}</div>`:"";
}
function scoreList(list,{big=false}={}){
  return `<ol class="scores ${big?"big":""}">${list.map((t,i)=>`<li style="--c:${t.color}" class="${t.me?"me":""}"><span class="pos">${i+1}º</span><span class="nm">${esc(t.name)}${t.me?" (vocês)":""}</span><b>${t.score}</b></li>`).join("")}</ol>`;
}
function keyboard(on,states={}){
  return `<div class="kb ${on?"":"off"}">`+KEYS.map((row,ri)=>`<div class="kr">`+[...row].map((k,ki)=>{
    if(ri===2&&ki===0) return `<button class="key wide" data-k="ENTER">ENVIAR</button>`;
    if(ri===2&&ki===row.length-1) return `<button class="key wide" data-k="BACK" aria-label="Apagar">⌫</button>`;
    return `<button class="key ${states[k]||""}" data-k="${k}">${k}</button>`;
  }).join("")+`</div>`).join("")+`</div>`;
}
function backBtn(armed){return `<button class="back ${armed?"armed":""}" data-act="back" aria-label="Sair">${armed?"Sair?":"←"}</button>`}
function fsBtn(){return document.fullscreenEnabled?`<button class="mini-btn" data-act="fs">${document.fullscreenElement?"Sair da tela cheia":"Tela cheia"}</button>`:""}
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen().catch(()=>{})}
function teamsSetup(names,back){
  return `<div class="scroll narrow">
    <button class="tohub" data-act="${back}">← Voltar</button>
    <div class="hero"><h1 class="brand">Equipes<span>De 2 a 6 equipes. Cada uma ganha uma cor.</span></h1></div>
    <div class="teamlist">${names.map((t,i)=>`<div class="teamrow" style="--c:${COLORS[i%COLORS.length]}"><span class="sw"></span>
      <input class="text" id="tk-team-${i}" maxlength="20" value="${esc(t)}" aria-label="Nome da equipe ${i+1}">
      ${names.length>2?`<button class="mini-btn" data-act="delteam" data-v="${i}" aria-label="Remover">✕</button>`:""}</div>`).join("")}</div>
    ${names.length<6?`<button class="ghost" data-act="addteam">+ Adicionar equipe</button>`:""}
    <button class="cta" data-act="startlocal">Começar</button>
  </div>`;
}
function readTeams(root,names){return names.map((t,i)=>{const el=root.querySelector("#tk-team-"+i);return el?el.value:t})}
function lobby({code,url,title,teams,online,net,armed,startLabel}){
  return `<div class="tv wide">
    <div class="tvtop">${backBtn(armed)}<span class="label">${esc(title)}</span>${fsBtn()}</div>
    <div class="lobby2">
      <div class="qrcol"><div class="qr" id="tk-qr" role="img" aria-label="QR code da sala" data-url="${esc(url)}"></div>
        <p class="code">${esc(code)}</p><p class="hint center">Cada equipe lê o QR com a câmera do celular.</p></div>
      <div class="lobbyside">
        ${netLine(net)||(net==="ready"?`<div class="ok-line">Sala aberta. Esperando as equipes…</div>`:"")}
