<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#141722">
<title>Jogos Bíblicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: hub of cards, then each game is a one-screen app (header, board, controls pinned at the bottom) */
:root{
  --bg:#eef0f5; --surface:#ffffff; --ink:#1b1e2b; --muted:#646a80; --line:#cfd3df;
  --key:#dde1ea; --absent:#8a8fa0; --green:#2f9e5a; --amber:#e0a12a;
  --me:#e2574c; --opp:#2f7fd8; --tile-ink:#ffffff; --warn:#c2410c;
  --block:#d6dae4; --sel:#f2c14e; --word:#fbe9b7; --wrong:#e2574c; --ok:#2f9e5a; --accent:#2f7fd8;
  --display:"Archivo Black", "Arial Black", Impact, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141722; --surface:#1e2231; --ink:#eef0f7; --muted:#9aa1b8; --line:#363c52;
  --key:#2f3448; --absent:#3b4054; --green:#3aa865; --amber:#d39a2a;
  --me:#f06a5e; --opp:#4c95e8; --tile-ink:#ffffff; --warn:#fb923c;
  --block:#1a1d2a; --sel:#d9a72e; --word:#4a3f22; --wrong:#f06a5e; --ok:#3aa865; --accent:#4c95e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141722; --surface:#1e2231; --ink:#eef0f7; --muted:#9aa1b8; --line:#363c52;
  --key:#2f3448; --absent:#3b4054; --green:#3aa865; --amber:#d39a2a;
  --me:#f06a5e; --opp:#4c95e8; --tile-ink:#ffffff; --warn:#fb923c;
  --block:#1a1d2a; --sel:#d9a72e; --word:#4a3f22; --wrong:#f06a5e; --ok:#3aa865; --accent:#4c95e8; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
.app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* shared pieces */
.brand{font-family:var(--display);line-height:1}
.scroll{flex:1;overflow:auto;padding-block:20px 24px;display:flex;flex-direction:column;gap:20px}
.cta{width:100%;padding:16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:900;font-size:17px}
.ghost{padding:12px;border-radius:12px;border:2px solid var(--line);font-weight:800;color:var(--muted);width:100%}
.label{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:0;line-height:1.45}
.field{display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:42px;margin:0;text-wrap:balance}
.hero h1 span{display:block;font-size:19px;color:var(--muted);margin-top:8px;font-family:var(--body);font-weight:800}
.tohub{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:10px;background:var(--surface);font-weight:900;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:800;font-size:14px;z-index:9;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

/* hub */
#hub .cards{display:flex;flex-direction:column;gap:14px}
#hub .card{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;text-align:left;background:var(--surface);border-radius:18px;padding:16px;border:2px solid var(--line);transition:border-color .15s}
#hub .card:hover,#hub .card:focus-visible{border-color:var(--ink)}
#hub .card h2{margin:0 0 4px;font-family:var(--display);font-size:22px;line-height:1.05}
#hub .card p{margin:0;font-size:14px;line-height:1.4;color:var(--muted);font-weight:700}
#hub .card .go{display:inline-block;margin-top:8px;font-size:13px;font-weight:900;color:var(--ink)}
#hub .art{width:96px;height:96px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
#hub .art .t{display:grid;grid-template-columns:repeat(4,18px);gap:3px}
#hub .art .t i,#hub .art .w i,#hub .art .x i{font-style:normal;font-family:var(--display);font-size:11px;display:grid;place-items:center;border-radius:4px;color:#fff}
#hub .art .t i{height:18px}
#hub .art .w{display:grid;grid-template-columns:repeat(5,15px);gap:2px;position:relative}
#hub .art .w i{height:15px;color:var(--ink);font-size:9px}
#hub .art .w b{position:absolute;left:-2px;top:15px;width:68px;height:15px;border-radius:8px;background:var(--amber);opacity:.4}
#hub .art .x{display:grid;grid-template-columns:repeat(5,15px);gap:2px}
#hub .art .x i{height:15px;color:var(--ink);font-size:9px}
#hub .art .x i.c{background:var(--surface);border:1px solid var(--line)}
#hub .foot{text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== Termo ===== */
#termo .me{--pc:var(--me)}
#termo .opp{--pc:var(--opp)}
#termo .who{color:var(--pc);font-weight:900}
#termo .brand{font-family:var(--display);line-height:1}
#termo .scroll{flex:1;overflow:auto;padding-block:20px 24px;display:flex;flex-direction:column;gap:20px}
#termo .col{display:flex;flex-direction:column;flex:1;min-height:0}
#termo .cta{width:100%;padding:16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:900;font-size:17px;letter-spacing:.02em}
#termo .cta.tinted{background:var(--pc);color:#fff}
#termo .cta:disabled{opacity:.35;cursor:default}
#termo .ghost{padding:12px;border-radius:12px;border:2px solid var(--line);font-weight:800;color:var(--muted);width:100%}
#termo .small{width:auto;padding:8px 14px;font-size:14px}
#termo .label{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#termo .hint{font-size:14px;color:var(--muted);margin:0;line-height:1.45}
#termo .field{display:flex;flex-direction:column;gap:8px}
#termo .text{width:100%;min-width:0;padding:14px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:800;font-size:16px}
#termo .chips{display:flex;gap:8px;flex-wrap:wrap}
#termo .chip{min-width:48px;height:48px;padding:0 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-size:18px}
#termo .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#termo .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px}
#termo .seg button{padding:11px 8px;border-radius:10px;font-weight:900;font-size:15px;color:var(--muted)}
#termo .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#termo .switch{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer}
#termo .switch span{flex:1;min-width:0;font-weight:800;font-size:15px}
#termo .switch small{display:block;font-weight:700;font-size:13px;color:var(--muted);margin-top:2px}
#termo .switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
#termo .switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
#termo .switch input:checked{background:var(--green)}
#termo .switch input:checked::after{transform:translateX(20px)}
#termo .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#termo .btns .cta{padding-inline:8px}
#termo .btns .cta.alt{background:var(--me);color:#fff}
#termo .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:13px}
#termo .or::before,#termo .or::after{content:"";flex:1;height:2px;background:var(--line)}
#termo .joinrow{display:flex;gap:8px}
#termo .joinrow .text{text-transform:uppercase;letter-spacing:.2em;font-family:var(--display)}
#termo .joinrow .cta{width:auto;padding-inline:20px}
#termo .settings{display:flex;flex-direction:column;gap:16px}
#termo .tagline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#termo .tag{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);border-radius:8px;padding:5px 8px}
#termo .row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;width:min(100%, calc(var(--n) * 60px))}
#termo .tile{aspect-ratio:1;max-width:100%;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(18px, calc(70vw / var(--n) / 2.1), 30px);background:var(--surface)}
#termo .tile.filled{border-color:var(--muted)}
#termo .tile.correct{background:var(--green);border-color:var(--green);color:var(--tile-ink)}
#termo .tile.present{background:var(--amber);border-color:var(--amber);color:var(--tile-ink)}
#termo .tile.absent{background:var(--absent);border-color:var(--absent);color:var(--tile-ink)}
#termo .tile.cursor{border-color:var(--pc,var(--ink));border-bottom-width:5px}
#termo .tile.pending{border-color:var(--muted);border-style:dashed}
#termo .flip{animation:flip .5s ease both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
#termo .shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#termo .hero h1{font-size:44px;margin:0;text-wrap:balance}
#termo .hero h1 span{display:block;font-size:20px;color:var(--muted);margin-top:8px;font-family:var(--body);font-weight:800}
#termo .example{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;padding:16px}
#termo .example .row{--n:5;width:220px}
#termo .example .tile{font-size:20px}
#termo .legend{display:grid;gap:6px;font-size:14px;color:var(--muted);margin:0;padding:0;list-style:none}
#termo .legend b{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
#termo .lobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:20px}
#termo .qr{background:#fff;padding:14px;border-radius:18px;line-height:0;box-shadow:0 0 0 4px var(--line)}
#termo .qr img,#termo .qr canvas{width:220px!important;height:220px!important;max-width:100%}
#termo .code{font-family:var(--display);font-size:40px;letter-spacing:.18em;margin:0}
#termo .share{display:flex;gap:8px;width:100%}
#termo .share button{flex:1}
#termo .wait{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted)}
#termo .spin{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--opp);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#termo .top{display:flex;align-items:center;gap:8px;padding-block:12px 6px}
#termo .pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface);border:2px solid transparent;font-weight:800;font-size:14px}
#termo .pill .dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
#termo .pill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#termo .pill .ct{font-variant-numeric:tabular-nums;color:var(--muted)}
#termo .pill.on{border-color:var(--pc)}
#termo .back{width:44px;height:44px;border-radius:12px;background:var(--surface);font-weight:900;font-size:20px;flex:none}
#termo .back.armed{background:var(--me);color:#fff;font-size:12px;width:auto;padding:0 10px}
#termo .net{font-size:13px;font-weight:800;color:var(--warn);text-align:center;padding:6px;border-radius:10px;background:var(--surface);margin-bottom:4px}
#termo .prompt{text-align:center;font-weight:800;font-size:17px;padding-block:4px 8px;text-wrap:balance}
#termo .prompt small{display:block;font-weight:700;font-size:13px;color:var(--muted);margin-top:2px}
#termo .dica{display:inline-block;margin-top:6px;font-size:13px;font-weight:900;color:var(--amber);border:2px solid var(--amber);border-radius:10px;padding:4px 10px}
#termo .dica.open{color:var(--ink);border-color:var(--line);background:var(--surface)}
#termo .board{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:4px 8px}
#termo .peek{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:800;color:var(--muted);padding-top:6px;min-height:30px}
#termo .peek .row{gap:3px;width:auto;grid-template-columns:repeat(var(--n),20px)}
#termo .peek .tile{border-radius:4px;border-width:1px;font-size:11px}
#termo .secretrow{display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;justify-content:center}
#termo .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#termo .eye{font-weight:800;font-size:14px;color:var(--muted);padding:8px 12px;border-radius:10px;border:2px solid var(--line)}
#termo .ready{font-weight:800;font-size:14px;color:var(--muted)}
#termo .ready.ok{color:var(--green)}
#termo .kb{display:flex;flex-direction:column;gap:7px;padding-block:8px 12px}
#termo .kb.off{opacity:.45;pointer-events:none}
#termo .kr{display:flex;gap:5px;justify-content:center}
#termo .key{flex:1;max-width:44px;height:54px;border-radius:8px;background:var(--key);font-weight:900;font-size:16px;display:grid;place-items:center;user-select:none;touch-action:manipulation}
#termo .key.wide{max-width:68px;flex:1.6;font-size:12px;letter-spacing:.04em}
#termo .key.correct{background:var(--green);color:var(--tile-ink)}
#termo .key.present{background:var(--amber);color:var(--tile-ink)}
#termo .key.absent{background:var(--absent);color:var(--tile-ink);opacity:.75}
#termo .key:active{filter:brightness(.9)}
#termo .winner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
#termo .winner h2{font-family:var(--display);font-size:36px;margin:0;line-height:1.1;text-wrap:balance}
#termo .winner p{margin:0;color:var(--muted);font-weight:700}
#termo .reveal{font-family:var(--display);font-size:30px;letter-spacing:.08em;margin:4px 0 0}
#termo .boards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#termo .mini{background:var(--surface);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;border-top:5px solid var(--pc);min-width:0}
#termo .mini .row{gap:3px;width:100%}
#termo .mini .tile{border-radius:4px;border-width:1px;font-size:clamp(9px, calc(36vw / var(--n) / 2.3), 15px)}
#termo .mini h3{margin:0 0 4px;font-size:14px;font-weight:900;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
#termo .mini .sw{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px;text-align:center}
#termo .mini .sw b{font-family:var(--display);color:var(--ink);font-size:15px;letter-spacing:.06em;display:block;word-break:break-all}
#termo .solo-board{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border-radius:16px;padding:16px}
#termo .solo-board .row{width:min(100%, calc(var(--n) * 40px))}
#termo .solo-board .tile{font-size:clamp(12px, calc(50vw / var(--n) / 2.2), 20px);border-radius:6px}
#termo .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
#termo .stats div{background:var(--surface);border-radius:12px;padding:10px 4px}
#termo .stats b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
#termo .stats span{font-size:12px;font-weight:800;color:var(--muted)}
#termo .stack{display:flex;flex-direction:column;gap:10px}
#termo .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:800;font-size:14px;z-index:9;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){#termo .flip,#termo .shake,#termo .spin{animation:none}
}
@media (max-height:640px){#termo .key{height:46px}
#termo .top{padding-block:8px 4px}
}


/* ===== Cruzadinha ===== */
#cruz .brand{font-family:var(--display);line-height:1}
#cruz .scroll{flex:1;overflow:auto;padding-block:20px 24px;display:flex;flex-direction:column;gap:20px}
#cruz .cta{width:100%;padding:16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:900;font-size:17px}
#cruz .cta.alt{background:var(--sel);color:#1b1e2b}
#cruz .ghost{padding:12px;border-radius:12px;border:2px solid var(--line);font-weight:800;color:var(--muted);width:100%}
#cruz .label{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#cruz .hint{font-size:14px;color:var(--muted);margin:0;line-height:1.45}
#cruz .field{display:flex;flex-direction:column;gap:8px}
#cruz .hero h1{font-size:42px;margin:0;text-wrap:balance}
#cruz .hero h1 span{display:block;font-size:19px;color:var(--muted);margin-top:8px;font-family:var(--body);font-weight:800}
#cruz .sample{display:grid;grid-template-columns:repeat(6,28px);gap:3px;align-self:flex-start}
#cruz .sample i{width:28px;height:28px;border-radius:5px;background:transparent;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:14px}
#cruz .sample i.c{background:var(--surface);border:2px solid var(--line)}
#cruz .sample i.h{background:var(--word);border-color:var(--sel)}
#cruz .themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#cruz .theme{padding:12px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:14px;text-align:left;line-height:1.25;min-width:0}
#cruz .theme small{display:block;font-weight:700;font-size:12px;color:var(--muted);margin-top:2px}
#cruz .theme[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#cruz .theme.wide{grid-column:1/-1}
#cruz .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px}
#cruz .seg button{padding:10px 4px;border-radius:10px;font-weight:900;font-size:14px;color:var(--muted);line-height:1.2}
#cruz .seg button small{display:block;font-weight:700;font-size:11px}
#cruz .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#cruz .top{display:flex;align-items:center;gap:8px;padding-block:12px 8px}
#cruz .back{width:44px;height:44px;border-radius:12px;background:var(--surface);font-weight:900;font-size:20px;flex:none}
#cruz .back.armed{background:var(--wrong);color:#fff;font-size:12px;width:auto;padding:0 10px}
#cruz .ttl{flex:1;min-width:0}
#cruz .ttl b{display:block;font-weight:900;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cruz .ttl span{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
#cruz .tools{display:flex;gap:6px}
#cruz .tool{height:44px;padding:0 12px;border-radius:12px;background:var(--surface);font-weight:900;font-size:13px}
#cruz .gridwrap{flex:1;min-height:0;overflow:auto;display:flex;padding-block:6px}
#cruz .grid{display:grid;gap:2px;margin:auto}
#cruz .cell{position:relative;border-radius:4px;background:transparent}
#cruz .cell.on{background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);cursor:pointer;color:var(--ink)}
#cruz .cell.on.word{background:var(--word);border-color:var(--sel)}
#cruz .cell.on.sel{background:var(--sel);border-color:var(--sel);color:#1b1e2b}
#cruz .cell.on.wrong{color:var(--wrong)}
#cruz .cell.on.wrong::after{content:"";position:absolute;inset:auto 18% 12% 18%;height:2px;background:var(--wrong);border-radius:1px}
#cruz .cell.on.rev{color:var(--accent)}
#cruz .cell.on.okw{border-color:var(--ok)}
#cruz .cell .num{position:absolute;top:1px;left:2px;font-family:var(--body);font-weight:900;font-size:clamp(7px,28%,11px);line-height:1;color:var(--muted)}
#cruz .cell.sel .num{color:#1b1e2b}
#cruz .cluebar{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:14px;padding:6px;margin-top:6px;min-height:64px}
#cruz .cluebar button{width:40px;height:48px;border-radius:10px;background:var(--key);font-weight:900;font-size:18px;flex:none}
#cruz .clue{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.3;text-align:center;cursor:pointer}
#cruz .clue small{display:block;font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
#cruz .clue em{font-style:normal;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
#cruz .kb{display:flex;flex-direction:column;gap:6px;padding-block:8px 12px}
#cruz .kr{display:flex;gap:5px;justify-content:center}
#cruz .key{flex:1;max-width:44px;height:50px;border-radius:8px;background:var(--key);font-weight:900;font-size:16px;display:grid;place-items:center;user-select:none;touch-action:manipulation}
#cruz .key.wide{max-width:68px;flex:1.6;font-size:13px}
#cruz .key:active{filter:brightness(.9)}
#cruz .sheet{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#cruz .panel{background:var(--bg);width:100%;max-width:560px;max-height:80%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:14px}
#cruz .panel h3{margin:0;font-family:var(--display);font-size:20px}
#cruz .panel ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#cruz .panel li button{width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:var(--surface);font-weight:700;font-size:14px;line-height:1.35;display:flex;gap:10px}
#cruz .panel li button b{font-family:var(--display);min-width:24px}
#cruz .panel li button.done{opacity:.55;text-decoration:line-through}
#cruz .panel .head{display:flex;justify-content:space-between;align-items:center}
#cruz .winner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
#cruz .winner h2{font-family:var(--display);font-size:36px;margin:0;line-height:1.1}
#cruz .winner p{margin:0;color:var(--muted);font-weight:700}
#cruz .learned{display:flex;flex-direction:column;gap:6px}
#cruz .learned div{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35}
#cruz .learned b{font-family:var(--display);letter-spacing:.04em;font-size:15px;margin-right:6px}
#cruz .learned em{font-style:normal;color:var(--muted);font-weight:800;white-space:nowrap}
#cruz .stack{display:flex;flex-direction:column;gap:10px}
#cruz .toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:800;font-size:14px;z-index:9;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
@media (max-height:660px){#cruz .key{height:42px}
#cruz .cluebar{min-height:54px}
#cruz .top{padding-block:8px 4px}
}


/* ===== Caça-palavras ===== */
#caca .themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#caca .theme{padding:12px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:14px;text-align:left;line-height:1.25;min-width:0}
#caca .theme small{display:block;font-weight:700;font-size:12px;color:var(--muted);margin-top:2px}
#caca .theme[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#caca .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px}
#caca .seg button{padding:10px 4px;border-radius:10px;font-weight:900;font-size:14px;color:var(--muted);line-height:1.2}
#caca .seg button small{display:block;font-weight:700;font-size:11px}
#caca .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

#caca .top{display:flex;align-items:center;gap:8px;padding-block:12px 8px}
#caca .back{width:44px;height:44px;border-radius:12px;background:var(--surface);font-weight:900;font-size:20px;flex:none}
#caca .back.armed{background:var(--wrong);color:#fff;font-size:12px;width:auto;padding:0 10px}
#caca .ttl{flex:1;min-width:0}
#caca .ttl b{display:block;font-weight:900;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#caca .ttl span{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
#caca .stage{flex:none;display:flex;justify-content:center;padding-block:4px}
#caca .board{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--surface);border-radius:14px;padding:6px}
#caca .letters{display:grid;position:relative;z-index:1}
#caca .lt{display:grid;place-items:center;font-family:var(--display);color:var(--ink);cursor:pointer}
#caca .lt.pend{background:var(--sel);border-radius:50%;color:#1b1e2b}
#caca .board svg{position:absolute;inset:6px;z-index:0;pointer-events:none;overflow:visible}
#caca .found-bar{margin-top:10px;background:var(--surface);border-radius:14px;padding:10px 12px;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:14px;line-height:1.35}
#caca .found-bar b{font-family:var(--display);letter-spacing:.04em;margin-right:6px}
#caca .found-bar em{font-style:normal;color:var(--muted);white-space:nowrap}
#caca .words{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center;padding-block:12px}
#caca .wd{font-weight:900;font-size:14px;letter-spacing:.06em;padding:6px 10px;border-radius:9px;background:var(--surface);border:2px solid var(--line)}
#caca .wd.done{text-decoration:line-through;color:var(--muted);border-color:var(--c);background:transparent}
#caca .winner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
#caca .winner h2{font-family:var(--display);font-size:36px;margin:0;line-height:1.1}
#caca .winner p{margin:0;color:var(--muted);font-weight:700}
#caca .learned{display:flex;flex-direction:column;gap:6px}
#caca .learned div{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;border-left:5px solid var(--c)}
#caca .learned b{font-family:var(--display);letter-spacing:.04em;font-size:15px;margin-right:6px}
#caca .learned em{font-style:normal;color:var(--muted);font-weight:800;white-space:nowrap}
#caca .stack{display:flex;flex-direction:column;gap:10px}

</style>

<script>
GAMES.termo=(function(){
const ROOT=document.getElementById("termo");
let booted=false;

function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z]/g,"")}
function score(g,s){
  const r=Array(g.length).fill("absent"),left={};
  for(let i=0;i<g.length;i++){ if(g[i]===s[i]) r[i]="correct"; else left[s[i]]=(left[s[i]]||0)+1; }
  for(let i=0;i<g.length;i++){ if(r[i]!=="correct"&&left[g[i]]>0){r[i]="present";left[g[i]]--;} }
  return r;
}
const isWin=r=>Array.isArray(r)&&r.length>0&&r.every(x=>x==="correct");
function blankGame(L){Object.assign(L,{mySecret:"",myHint:"",myGuesses:[],myResults:[],oppReady:false,oppGuesses:[],oppSecret:"",oppHint:""});return L}
function mySolvedAt(L){return L.myResults.findIndex(isWin)}
function oppSolvedAt(L){return L.mySecret?L.oppGuesses.indexOf(L.mySecret):-1}
// A rodada termina quando os dois têm o mesmo número de chutes e todos já foram conferidos.
function isOver(L){
  if(!L.mySecret||!L.oppReady) return false;
  const a=L.myGuesses.length,b=L.oppGuesses.length;
  if(a!==b||L.myResults.length<a) return false;
  return mySolvedAt(L)>=0||oppSolvedAt(L)>=0||a>=L.max;
}
function canGuess(L){
  return L.phase==="play"&&!isOver(L)&&L.myGuesses.length<L.max&&mySolvedAt(L)<0
    &&L.myResults.length===L.myGuesses.length&&L.myGuesses.length<=L.oppGuesses.length;
}
// O que este celular manda para o outro: nunca a palavra secreta antes do fim.
function outgoing(L){
  const host=L.role==="host";
  return {t:"state",game:L.game,name:L.myName,
    n:host?L.n:undefined,max:host?L.max:undefined,words:host?L.words:undefined,dict:host?L.dict:undefined,
    ready:!!L.mySecret,hint:L.mySecret?L.myHint:"",guesses:L.myGuesses.slice(),
    scored:L.mySecret?L.oppGuesses.map(w=>score(w,L.mySecret)):[],
    reveal:L.phase==="end"?L.mySecret:null};
}
// Aplica o estado recebido do outro celular. Retorna "newgame", "stale" ou "ok".
function incoming(L,m){
  if(!m||m.t!=="state") return "stale";
  const g=Number(m.game)||1;
  let res="ok";
  if(g<L.game) return "stale";
  if(g>L.game){L.game=g;blankGame(L);if(L.phase==="play"||L.phase==="end")L.phase="secret";res="newgame"}
  L.oppName=String(m.name||"").slice(0,16);
  if(L.role==="guest"){
    const n=+m.n,x=+m.max;if(n>=4&&n<=8)L.n=n;if(x>=4&&x<=8)L.max=x;
    if(m.words==="comuns"||m.words==="biblia")L.words=m.words;
    if(typeof m.dict==="boolean")L.dict=m.dict;
  }
  L.oppReady=!!m.ready;
  L.oppHint=typeof m.hint==="string"?m.hint.slice(0,60):"";
  const ok=w=>typeof w==="string"&&norm(w)===w&&w.length===L.n;
  L.oppGuesses=(Array.isArray(m.guesses)?m.guesses:[]).filter(ok).slice(0,L.max);
  const sc=Array.isArray(m.scored)?m.scored:[];
  L.myResults=sc.slice(0,L.myGuesses.length).filter(r=>Array.isArray(r)&&r.length===L.n&&r.every(x=>x==="correct"||x==="present"||x==="absent"));
  if(m.reveal&&typeof m.reveal==="string") L.oppSecret=norm(m.reveal).slice(0,L.n);
  return res;
}
// Avança a fase a partir do estado atual.
function step(L){
  if(L.phase==="lobby"&&L.connectedOnce&&L.oppName) L.phase="secret";
  if(L.phase==="secret"&&L.mySecret&&L.oppReady) L.phase="play";
  if(L.phase==="play"&&isOver(L)) L.phase="end";
}
function result(L){
  const a=mySolvedAt(L),b=oppSolvedAt(L);
  if(a>=0&&b>=0) return a===b?{kind:"tie",tries:a+1}:(a<b?{kind:"me",tries:a+1}:{kind:"opp",tries:b+1});
  if(a>=0) return {kind:"me",tries:a+1};
  if(b>=0) return {kind:"opp",tries:b+1};
  return {kind:"none"};
}

const BIB={};   // PALAVRA normalizada -> {shown:"Palavra com acento", theme:"Tema"}
for(const [theme,list] of Object.entries(BIBLIA)) for(const w of list.split(" ")){const k=norm(w);if(!BIB[k])BIB[k]={shown:w,theme}}
const _sets={};
function inDict(w){
  const n=w.length;if(n<4||n>8)return false;
  if(!_sets[n]){const s=new Set(),str=DICT[n]||"";for(let i=0;i<str.length;i+=n)s.add(str.slice(i,i+n));_sets[n]=s}
  return _sets[n].has(w);
}
function pool(words,n){
  if(words==="biblia") return Object.keys(BIB).filter(w=>w.length===n);
  return (COMUNS[n]||"").split(" ").filter(Boolean);
}
function draw(words,n,avoid=[]){
  const p=pool(words,n);if(!p.length)return "";
  const fresh=p.filter(w=>!avoid.includes(w));
  const from=fresh.length?fresh:p;
  const a=new Uint32Array(1);crypto.getRandomValues(a);
  return from[a[0]%from.length];
}
function hintFor(words,w){return words==="biblia"&&BIB[w]?BIB[w].theme:""}
function shown(w){return BIB[w]?BIB[w].shown.toUpperCase():w}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const myNm=()=>L.myName||"Você";
const oppNm=()=>L.oppName||"Adversário";
const wordsLabel=w=>w==="biblia"?"Palavras bíblicas":"Palavras comuns";
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function inviteURL(){return location.href.split(/[?#]/)[0]+"?sala="+L.code}
function genCode(){let s="";const a=new Uint32Array(5);crypto.getRandomValues(a);for(const x of a)s+=ABC[x%ABC.length];return s}
function setURL(code){try{history.replaceState(null,"",location.pathname+(code?"?sala="+code:""))}catch(e){}}
const tries=k=>`${k} tentativa${k>1?"s":""}`;

/* ---------------- rede (PeerJS) ---------------- */
// Servidores que ajudam os celulares a se acharem (STUN) e, quando a operadora bloqueia,
// a passar a conexão adiante (TURN). Os dois TURN são os gratuitos do próprio PeerJS.
const ICE={iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"}
]};
let failures=0, reopenTries=0, openT=null, beatT=null, lastHeard=0;
function newPeer(id){const o={debug:0,config:ICE};return id?new Peer(id,o):new Peer(o)}
function openPeer(){
  clearTimeout(retryT);clearTimeout(openT);
  if(peer){try{peer.destroy()}catch(e){} peer=null}
  if(typeof Peer==="undefined"){net="nolib";render();return}
  if(!navigator.onLine){net="nointernet";render();return}
  net=L.role==="host"?"opening":"connecting";render();
  if(L.role==="host"){
    peer=newPeer(PREFIX+L.code);
    peer.on("open",()=>{failures=0;reopenTries=0;net=conn&&conn.open?"online":"waiting";render()});
    peer.on("connection",c=>{ if(conn&&conn!==c){try{conn.close()}catch(e){}} wire(c) });
  } else {
    peer=newPeer();
    peer.on("open",()=>connectToHost());
  }
  peer.on("disconnected",()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    const t=e&&e.type;
    if(t==="unavailable-id"){
      // O código continua o mesmo: quase sempre é a própria sala antiga que o servidor ainda não soltou.
      reopenTries++;
      if(reopenTries>6&&!L.connectedOnce&&L.phase==="lobby"){reopenTries=0;L.code=genCode();setURL(L.code);save();}  // código realmente em uso por outra sala
      net="reopening";render();retryT=setTimeout(openPeer,3000);
    } else if(t==="peer-unavailable"){ failed("nohost"); }
    else { net=navigator.onLine?"offline":"nointernet";render();retryT=setTimeout(openPeer,4000); }
  });
}
function connectToHost(){
  if(!peer||peer.destroyed||!peer.open) return openPeer();
  clearTimeout(openT);
  const c=peer.connect(PREFIX+L.code,{reliable:true});
  wire(c);
  // Se a conexão não abrir em 12 s, a rede provavelmente travou: tenta de novo.
  openT=setTimeout(()=>{ if(conn===c&&!c.open){try{c.close()}catch(e){} conn=null; failed("stuck")} },12000);
}
// Convidado: tenta sozinho algumas vezes; depois mostra o botão "Tentar de novo".
function failed(kind){
  failures++;
  if(failures>=4){net=kind==="nohost"?"givenohost":"giveup";render();return}
  net=kind==="nohost"?"nohost":"lost";render();retryLater();
}
function retryLater(){
  clearTimeout(retryT);
  retryT=setTimeout(()=>{ if(conn&&conn.open) return; if(L.role==="guest"&&peer&&peer.open&&!peer.destroyed) connectToHost(); else openPeer(); },2500);
}
function wire(c){
  conn=c;
  c.on("open",()=>{ if(conn!==c)return; clearTimeout(openT);failures=0;net="online";L.connectedOnce=true;lastHeard=Date.now();lastSent="";push();beat();render(); });
  c.on("data",m=>{ if(conn!==c)return; lastHeard=Date.now(); if(m&&m.t==="ping")return; onData(m) });
  const lost=()=>{ if(conn!==c)return; conn=null;clearTimeout(openT);
    if(L.role==="host"){net="waiting";render()} else failed("lost") };
  c.on("close",lost); c.on("error",lost);
}
// Batimento: a cada 4 s cada celular avisa que está vivo. Sem notícia por 15 s, a conexão é refeita.
function beat(){
  clearInterval(beatT);
  beatT=setInterval(()=>{
    if(!conn||!conn.open) return;
    try{conn.send({t:"ping"})}catch(e){}
    if(Date.now()-lastHeard>15000){const c=conn;try{c.close()}catch(e){} if(conn===c){conn=null; if(L.role==="host"){net="waiting";render()} else failed("lost")}}
  },4000);
}
function push(){
  if(!conn||!conn.open) return;
  const msg=outgoing(L),s=JSON.stringify(msg);
  if(s===lastSent) return;
  lastSent=s;
  try{conn.send(msg)}catch(e){lastSent=""}
}
function onData(m){
  const before=L.myResults.length, phase0=L.phase, opp0=L.oppName;
  const r=incoming(L,m);
  if(r==="stale"){lastSent="";push();return}
  if(r==="newgame"){cur="";showSecret=false;showHint=false;toast(`${oppNm()} começou uma nova partida`)}
  if(L.myResults.length>before) flashRow=L.myResults.length-1;
  if(!opp0&&L.oppName&&L.phase==="lobby") toast(`${oppNm()} entrou na sala`);
  step(L);
  keepAwake();
  save();render();push();
}
function retryNow(){failures=0;if(L.role==="guest"&&peer&&peer.open&&!peer.destroyed)connectToHost();else openPeer()}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!L||!L.role) return;
  if(peer&&peer.disconnected&&!peer.destroyed){try{peer.reconnect()}catch(e){}}
  if(conn&&conn.open){lastSent="";push();}                 // volta do bloqueio: reenvia o estado
  else if(L.role==="guest"){failures=0;retryLater()}
  else if(!peer||peer.destroyed) openPeer();
  keepAwake();
});
window.addEventListener("online",()=>{ if(L&&L.role&&(!conn||!conn.open)){failures=0;openPeer()} });
// Tela acesa enquanto houver sala aberta ou partida: com a tela apagada, a sala cai.
async function keepAwake(){
  const need=L&&(["lobby","secret","play"].includes(L.phase)||L.phase==="solo");
  try{if(need&&"wakeLock" in navigator&&!wake&&document.visibilityState==="visible"){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}
}

/* ---------------- peças da tela ---------------- */
function tiles(word,res,{anim=false,mask=false,cursor=-1,pending=false,n=L.n}={}){
  let h="";
  for(let i=0;i<n;i++){
    const ch=word[i]||"";
    const st=res?res[i]:(pending?"pending":(ch?"filled":""));
    h+=`<div class="tile ${st} ${anim?"flip":""} ${i===cursor?"cursor":""}"${anim?` style="animation-delay:${i*0.13}s"`:""}>${esc(mask&&ch?"•":ch)}</div>`;
  }
  return `<div class="row" style="--n:${n}">${h}</div>`;
}
function keyboard(states,on,enter="ENVIAR"){
  return `<div class="kb ${on?"":"off"}">`+KEYS.map((row,ri)=>`<div class="kr">`+[...row].map((k,ki)=>{
    if(ri===2&&ki===0) return `<button class="key wide" data-k="ENTER" aria-label="Enviar">${enter}</button>`;
    if(ri===2&&ki===row.length-1) return `<button class="key wide" data-k="BACK" aria-label="Apagar">⌫</button>`;
    return `<button class="key ${states[k]||""}" data-k="${k}">${k}</button>`;
  }).join("")+`</div>`).join("")+`</div>`;
}
function keyStates(guesses,results){
  const m={},rank={absent:1,present:2,correct:3};
  results.forEach((r,gi)=>{const g=guesses[gi];if(!r||!g)return;r.forEach((x,i)=>{if(!m[g[i]]||rank[x]>rank[m[g[i]]])m[g[i]]=x})});
  return m;
}
function netBanner(){
  const msgs={lost:`Conexão com ${esc(oppNm())} caiu. Reconectando…`,waiting:`${esc(oppNm())} saiu da sala. Esperando voltar…`,
    nohost:"Procurando a sala…",offline:"Sem conexão com o servidor. Tentando de novo…",connecting:"Conectando…",
    opening:"Abrindo a sala…",reopening:"Reabrindo a sala…",nointernet:"Este celular está sem internet.",
    nolib:"Não consegui carregar a parte de conexão. Verifique a internet e recarregue a página."};
  if(net==="giveup"||net==="givenohost") return `<div class="net">${net==="givenohost"?"Não achei a sala. Confira se quem criou está com o jogo aberto e a tela acesa.":"Não consegui conectar nesta rede."} <button class="eye" data-act="retry" style="margin-left:6px">Tentar de novo</button><br><small>Se continuar, tentem os dois no mesmo Wi-Fi, ou os dois nos dados móveis.</small></div>`;
  return (net!=="online"&&msgs[net])?`<div class="net">${msgs[net]}</div>`:"";
}
function hintBtn(text){
  if(!text) return "";
  return showHint?`<span class="dica open">Dica: ${esc(text)}</span>`:`<button class="dica" data-act="hint">Ver dica</button>`;
}
function backBtn(){return `<button class="back ${backArmed?"armed":""}" data-act="back" aria-label="Voltar ao início">${backArmed?"Sair?":"←"}</button>`}

function render(){
  const a=ROOT;
  const v={home:vHome,join:vJoin,lobby:vLobby,secret:vSecret,play:vPlay,end:vEnd,solo:vSolo,soloend:vSoloEnd}[L.phase]||vHome;
  a.innerHTML=v();
  if(L.phase==="lobby"&&L.role==="host") drawQR();
  flashRow=-1;
  const b=a.querySelector(".board"); if(b) b.scrollTop=b.scrollHeight;
}

  return `<div class="settings">
    <div class="field"><span class="label">Letras da palavra</span><div class="chips">${chips([4,5,6,7,8],L.n,"n")}</div></div>
    <div class="field"><span class="label">Tentativas</span><div class="chips">${chips([4,5,6,7,8],L.max,"max")}</div></div>
    <div class="field"><span class="label">Tipo de palavra</span>
      <div class="seg"><button data-act="words" data-v="comuns" aria-pressed="${L.words==="comuns"}">Comuns</button><button data-act="words" data-v="biblia" aria-pressed="${L.words==="biblia"}">Bíblicas</button></div></div>
    <label class="switch"><span>Só palavras do dicionário<small>Desligue para aceitar nomes e palavras fora da lista</small></span><input type="checkbox" id="dict" ${L.dict?"checked":""}></label>
  </div>`;
}

function vJoin(){
  const p=prefs();
  return `<div class="scroll" style="justify-content:center">
    <div class="hero"><h1 class="brand">Termo em Dupla<span>Você foi chamado para a sala <b style="font-family:var(--display);color:var(--ink);letter-spacing:.12em">${esc(L.code)}</b></span></h1></div>
    <div class="field"><label class="label" for="myname">Seu nome</label>

function roomTags(){return `<div class="tagline"><span class="tag">${L.n} letras</span><span class="tag">${L.max} tentativas</span><span class="tag">${wordsLabel(L.words)}</span>${L.dict?"":`<span class="tag">Vale qualquer palavra</span>`}</div>`}
function vLobby(){
  if(L.role==="guest") return `<div class="lobby">
      <p class="code">${esc(L.code)}</p>
      ${net==="giveup"||net==="givenohost"?netBanner():`<div class="wait"><span class="spin"></span>${net==="nohost"?"Procurando a sala…":net==="nointernet"?"Sem internet neste celular":"Entrando na sala…"}</div>`}
      <p class="hint">Quem criou a sala precisa estar com o jogo aberto e a tela acesa.</p>
      <button class="ghost" data-act="leave">Cancelar</button></div>`;

  return `<div class="lobby">

function drawQR(){
  const el=document.getElementById("qr"); if(!el) return;
  if(typeof QRCode==="undefined"){el.textContent="";return}
  el.innerHTML="";
  new QRCode(el,{text:inviteURL(),width:440,height:440,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function vSecret(){
  if(L.mySecret){
    return `<div class="col me">${netBanner()}<div class="secretrow">
      <span class="label">Sua palavra secreta</span>
      ${tiles(L.mySecret,null,{mask:!showSecret})}
      <button class="eye" data-act="eye">${showSecret?"Esconder":"Mostrar"}</button>
      <div class="wait"><span class="spin"></span>Esperando ${esc(oppNm())} escolher a palavra…</div>
      <button class="ghost small" data-act="rechoose">Trocar minha palavra</button>
    </div></div>`;
  }
  return `<div class="col me">${netBanner()}
    <div class="prompt" style="padding-top:20px"><span class="who">${esc(myNm())}</span>, escolha sua palavra secreta
      <small>${L.n} letras · ${esc(oppNm())} vai tentar descobrir</small></div>
    <div class="secretrow">
      <div data-active>${tiles(cur,null,{mask:!showSecret,cursor:cur.length<L.n?cur.length:-1})}</div>
      <div class="actions"><button class="eye" data-act="eye">${showSecret?"Esconder letras":"Mostrar letras"}</button><button class="eye" data-act="draw">Sortear para mim</button></div>
      ${roomTags()}
      <span class="ready ${L.oppReady?"ok":""}">${L.oppReady?`✓ ${esc(oppNm())} já escolheu`:`${esc(oppNm())} está escolhendo…`}</span>
    </div>
    ${keyboard({},true,"OK")}
