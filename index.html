        ${teams.length?`<div class="joined">${teams.map(t=>`<span class="jt ${online(t.id)?"":"off"}" style="--c:${t.color}">${esc(t.name)}</span>`).join("")}</div>`:`<p class="hint">Nenhuma equipe ainda.</p>`}
        <button class="cta" data-act="hoststart" ${teams.length?"":"disabled"}>${startLabel||"Começar"}</button>
        <p class="hint">Deixe esta tela aberta. Quem entrar depois do começo também joga.</p>
      </div>
    </div>
  </div>`;
}
function drawQR(root){
  const el=root.querySelector("#tk-qr");if(!el||typeof QRCode==="undefined")return;
  el.innerHTML="";new QRCode(el,{text:el.dataset.url,width:520,height:520,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function joinView(game,code,name){
  return `<div class="scroll narrow" style="justify-content:center">
    <div class="hero"><h1 class="brand">${esc(game)}<span>Sala <b class="codeinline">${esc(code)}</b></span></h1></div>
    <div class="field"><label class="label" for="tk-name">Nome da equipe</label>
      <input class="text" id="tk-name" maxlength="20" placeholder="Ex.: Leões de Judá" value="${esc(name||"")}" autocomplete="off"></div>
    <button class="cta" data-act="teamjoin">Entrar na sala</button>
    <button class="ghost" data-act="teamcancel">Voltar aos jogos</button>
  </div>`;
}
function waitView(code,net){
  return `<div class="scroll narrow" style="justify-content:center;text-align:center">
    <p class="code">${esc(code)}</p>
    ${netLine(net)||`<div class="wait"><span class="spin"></span>Entrando na sala…</div>`}
    <p class="hint">O telão precisa estar com a sala aberta.</p>
    <button class="ghost" data-act="teamcancel">Cancelar</button></div>`;
}
function teamHead(st,net,armed){
  return `<div class="tvtop">${backBtn(armed)}<span class="tname" style="--c:${st.color}"><i></i>${esc(st.name)}</span><span class="sc">${st.score} ${st.score===1?"pt":"pts"}</span></div>${netLine(net)}`;
}
function finalView(list,{armed,againAct,closeAct,closeLabel}){
  const top=list[0]||{name:"",score:0},tie=list.length>1&&list[1].score===top.score;
  return `<div class="tv wide reveal"><div class="tvtop">${backBtn(armed)}${fsBtn()}</div>
    <div class="revealbox"><span class="label">Resultado final</span>
    <p class="word">${tie?"Empate!":esc(top.name)}</p>
    <p class="verdict">${tie?"Mais de uma equipe terminou com a mesma pontuação.":`venceu com ${pts(top.score)}!`}</p>
    ${scoreList(list,{big:true})}
    ${againAct?`<button class="cta" data-act="${againAct}">Jogar de novo com as mesmas equipes</button>`:""}
    <button class="ghost" data-act="${closeAct}">${closeLabel||"Voltar ao início"}</button></div></div>`;
}
function teamEndView(st,armed){
  const pos=st.board.findIndex(b=>b.me)+1;
  return `<div class="col">${teamHead(st,"online",armed)}<div class="center-box">
    <span class="label">Fim de jogo</span><p class="word">${pos}º lugar</p>
    <p class="verdict">Vocês fizeram ${pts(st.score)}.</p>${scoreList(st.board)}
    <button class="ghost" data-act="teamcancel">Voltar aos jogos</button></div></div>`;
}
let wake=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!wake&&document.visibilityState==="visible"){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
function ranking(teams,order,meId){return order.map(id=>({id,...teams[id],me:id===meId})).sort((a,b)=>b.score-a.score)}
function clearParam(){try{history.replaceState(null,"",location.pathname)}catch(e){}}

return {ICE,COLORS,norm,esc,rnd,genCode,genId,put,get,toast,pts,host,team,netLine,scoreList,keyboard,backBtn,fsBtn,toggleFs,
  teamsSetup,readTeams,lobby,drawQR,joinView,waitView,teamHead,finalView,teamEndView,keepAwake,ranking,clearParam};
})();

</script>
<script>
window.GAMES=window.GAMES||{};
GAMES.cacatv=(function(){
const K=TVKIT, ROOT=document.getElementById("cacatv");
const SAVE="cacatv-v1", TEAMSAVE="cacatv-equipe-v1", PREFIX="caca-telao-lgda-", GAME="Caça-palavras no Telão";
const ALL="Tudo misturado", THEMES=Object.keys(DICAS);
const LEVELS={facil:"Fácil",medio:"Médio",dificil:"Difícil"};
let view="home", booted=false, armed=false, kbOn=false;
let cfg={theme:THEMES[0],level:"medio",teams:["Equipe 1","Equipe 2"]};
let LS=null, HS=null, T=null, room=null, link=null, drag=null, pending=null, pick=null;

function save(){K.put(SAVE,{cfg,LS,HS})}
const gen=(theme,level)=>{const g=GAMES.caca._test.generate(theme,level);g.words.forEach(w=>{w.by=null;delete w.found;delete w.color});return g};
const endOf=w=>[w.r+w.dr*(w.g.length-1),w.c+w.dc*(w.g.length-1)];
function matchIn(words,a,b){
  for(let i=0;i<words.length;i++){
    const w=words[i],[er,ec]=endOf(w);
    if((a[0]===w.r&&a[1]===w.c&&b[0]===er&&b[1]===ec)||(b[0]===w.r&&b[1]===w.c&&a[0]===er&&a[1]===ec)) return i;
  }
  return -1;
}
function snap(a,r,c,S){
  let dr=r-a[0],dc=c-a[1];const ar=Math.abs(dr),ac=Math.abs(dc);
  if(ar>=2*ac)dc=0;else if(ac>=2*ar)dr=0;else{const m=Math.max(ar,ac);dr=Math.sign(dr)*m;dc=Math.sign(dc)*m}
  let er=a[0]+dr,ec=a[1]+dc;
  while(er<0||er>=S||ec<0||ec>=S){dr-=Math.sign(dr);dc-=Math.sign(dc);er=a[0]+dr;ec=a[1]+dc}
  return [er,ec];
}

/* ---------- regras: só telão ---------- */
function localStart(){
  LS={teams:cfg.teams.map((n,i)=>({name:n.trim()||`Equipe ${i+1}`,color:K.COLORS[i%K.COLORS.length],score:0})),theme:cfg.theme,level:cfg.level,round:1,grid:gen(cfg.theme,cfg.level),last:-1,status:"play"};
}
function localClaim(wi,team){
  const w=LS.grid.words[wi];if(w.by!==null) return;
  w.by=team;LS.teams[team].score++;LS.last=wi;
  if(LS.grid.words.every(x=>x.by!==null)) LS.status="done";
}
/* ---------- regras: telão + celulares ---------- */
function hostCreate(){HS={code:K.genCode(),theme:cfg.theme,level:cfg.level,round:0,status:"lobby",teams:{},order:[],grid:null,last:null}}
function hostJoin(tid,name){
  if(!HS.teams[tid]){HS.teams[tid]={name,color:K.COLORS[HS.order.length%K.COLORS.length],score:0};HS.order.push(tid);return true}
  HS.teams[tid].name=name;return false;
}
function hostRound(){HS.round++;HS.grid=gen(HS.theme,HS.level);HS.status="play";HS.last=null}
// Retorna "ok" (achou), "taken" (outra equipe achou antes) ou "miss".
function hostPick(tid,round,a,b){
  if(!HS.teams[tid]||HS.status!=="play"||round!==HS.round) return {r:"late"};
  const ok=p=>Array.isArray(p)&&p.length===2&&p.every(x=>Number.isInteger(x)&&x>=0&&x<HS.grid.size);
  if(!ok(a)||!ok(b)) return {r:"miss"};
  const i=matchIn(HS.grid.words,a,b);
  if(i<0) return {r:"miss"};
  const w=HS.grid.words[i];
  if(w.by) return {r:"taken",by:HS.teams[w.by]?HS.teams[w.by].name:""};
  w.by=tid;HS.teams[tid].score++;HS.last={i,tid};
  if(HS.grid.words.every(x=>x.by)) HS.status="done";
  return {r:"ok",i};
}
function teamView(tid){
  const t=HS.teams[tid];if(!t) return null;
  const g=HS.grid, last=HS.last&&g?g.words[HS.last.i]:null;
  return {t:"state",status:HS.status,round:HS.round,name:t.name,color:t.color,score:t.score,
    size:g?g.size:0,cells:g?g.cells:"",
    words:g?g.words.map(w=>w.by?{w:w.w,color:HS.teams[w.by].color,mine:w.by===tid,line:[w.r,w.c,...endOf(w)]}:{w:w.w}):[],
    last:last?{w:last.w,clue:last.clue,ref:last.ref,team:HS.teams[HS.last.tid].name,color:HS.teams[HS.last.tid].color}:null,
    board:K.ranking(HS.teams,HS.order,tid).map(x=>({name:x.name,color:x.color,score:x.score,me:x.me}))};
}
function sendAll(){if(room&&HS)for(const id of HS.order)room.sendTo(id,teamView(id))}
function onHostData(c,m){
  if(!HS) return;
  if(m.t==="hello"){
    const tid=String(m.tid||"").slice(0,40),name=String(m.name||"").trim().slice(0,20)||"Equipe";if(!tid)return;
    c.tid=tid;if(hostJoin(tid,name))K.toast(`${name} entrou`);save();sendAll();render();return;
  }
  if(!c.tid) return;
  if(m.t==="sync"){room.sendTo(c.tid,teamView(c.tid));return}
  if(m.t==="pick"){
    const r=hostPick(c.tid,m.round,m.a,m.b);
    if(r.r==="ok"){const w=HS.grid.words[r.i];K.toast(`${HS.teams[c.tid].name} achou ${w.w.toUpperCase()}`);save();sendAll();render()}
    else room.sendTo(c.tid,{t:"msg",kind:r.r,by:r.by||""});
  }
}

/* ---------- desenho da grade ---------- */
function boardHTML(size,cells,cs,lines,{interactive,pend}={}){
  let h="";
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    const p=pend&&pend[0]===r&&pend[1]===c;
    h+=`<div class="lt ${p?"pend":""}" data-r="${r}" data-c="${c}">${cells[r*size+c]}</div>`;
  }
  return `<div class="wsboard ${interactive?"touch":""}" id="ct-board"><svg id="ct-svg" width="${size*cs}" height="${size*cs}">${linesSVG(lines,cs)}</svg>
    <div class="letters" style="grid-template-columns:repeat(${size},${cs}px);grid-auto-rows:${cs}px;font-size:${Math.round(cs*.52)}px">${h}</div></div>`;
}
function linesSVG(lines,cs){
  return lines.map(l=>{const x1=l.a[1]*cs+cs/2,y1=l.a[0]*cs+cs/2,x2=l.b[1]*cs+cs/2,y2=l.b[0]*cs+cs/2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${l.color}" stroke-width="${cs*.78}" stroke-linecap="round" opacity="${l.op||.42}"/>`}).join("");
}
function tvCell(size){return Math.max(22,Math.min(70,Math.floor(Math.min((window.innerHeight-130)/size,(Math.min(window.innerWidth,1500)*0.6-40)/size))))}
function phoneCell(size){return Math.max(20,Math.min(42,Math.floor(Math.min(Math.min(window.innerWidth,560)-44,window.innerHeight-330)/size)))}
function wordChips(words,colorOf){
  return `<div class="wchips">${words.map(w=>{const c=colorOf(w);return `<span class="wd ${c?"done":""}" style="--c:${c||"var(--line)"}">${K.esc(w.w.toUpperCase())}</span>`}).join("")}</div>`;
}
function lastBar(l){return l?`<div class="lastbar" style="--c:${l.color}"><b>${K.esc(l.w.toUpperCase())}</b> ${K.esc(l.clue)} ${l.ref?`<em>(${K.esc(l.ref)})</em>`:""}<small>achada por ${K.esc(l.team)}</small></div>`:`<div class="lastbar empty">As dicas das palavras achadas aparecem aqui.</div>`}

/* ---------- telas ---------- */
function render(){
  if(HS&&view.startsWith("h-")&&view!=="h-lobby"&&view!=="h-"+HS.status) view="h-"+HS.status;
  const v={home:vHome,teams:()=>K.teamsSetup(cfg.teams,"home"),"l-play":vLocal,"l-end":vLocalEnd,
    "h-lobby":vLobby,"h-play":vHost,"h-done":vHost,"h-end":vHostEnd,
    "t-join":()=>K.joinView(GAME,T.code,T.name),"t-wait":()=>K.waitView(T.code,link?link.net:"connecting"),"t-lobby":vTeamLobby,"t-play":vTeam,"t-done":vTeam,"t-end":()=>K.teamEndView(T.st,armed)}[view]||vHome;
  ROOT.innerHTML=v();
  if(view==="h-lobby") K.drawQR(ROOT);
}
function vHome(){
  const t=n=>`<button class="theme" data-act="theme" data-v="${K.esc(n)}" aria-pressed="${cfg.theme===n}">${K.esc(n)}</button>`;
  return `<div class="scroll narrow">
    <button class="tohub" data-act="tocaca">← Caça-palavras</button>
    <div class="hero"><h1 class="brand">Caça-palavras no Telão<span>Equipes disputam quem acha mais palavras.</span></h1></div>
    ${LS&&LS.status!=="end"?`<button class="cta resume" data-act="resumeL">Continuar partida no telão</button>`:""}
    ${HS&&HS.status!=="end"?`<button class="cta resume" data-act="resumeH">Voltar para a sala ${K.esc(HS.code)}</button>`:""}
    <div class="field"><span class="label">Tema</span><div class="themes">${THEMES.map(t).join("")}${t(ALL)}</div></div>
    <div class="field"><span class="label">Nível</span><div class="seg3">${Object.entries(LEVELS).map(([k,v])=>`<button data-act="level" data-v="${k}" aria-pressed="${cfg.level===k}">${v}</button>`).join("")}</div></div>
    <div class="modes">
      <button class="mode" data-act="local"><b>Só o telão</b><span>A grade grande na TV. Quando uma equipe acha uma palavra, quem comanda marca na tela e toca na equipe. Não precisa de internet.</span></button>
      <button class="mode" data-act="host"><b>Telão + celulares</b><span>A mesma grade no celular de cada equipe. Quem acha primeiro fica com a palavra, pintada com a sua cor na TV.</span></button>
    </div>
  </div>`;
}
function vLocal(){
  const g=LS.grid,cs=tvCell(g.size),wide=window.innerWidth>=900;
  const lines=g.words.filter(w=>w.by!==null).map(w=>({a:[w.r,w.c],b:endOf(w),color:LS.teams[w.by].color}));
  const lw=LS.last>=0?g.words[LS.last]:null;
  const picker=pick?`<div class="overlay"><div class="pickbox"><span class="label">Quem achou</span><p class="word sm">${K.esc(g.words[pick.wi].w.toUpperCase())}</p>
    <div class="pickteams">${LS.teams.map((t,i)=>`<button class="pt" style="--c:${t.color}" data-act="claim" data-v="${i}">${K.esc(t.name)}</button>`).join("")}</div>
    <button class="ghost" data-act="cancelpick">Cancelar</button></div></div>`:"";
  const done=LS.status==="done"?`<div class="overlay"><div class="pickbox"><span class="label">Grade completa</span><p class="word sm">Todas achadas!</p>
    ${K.scoreList(LS.teams.slice().sort((a,b)=>b.score-a.score))}
    <button class="cta" data-act="localnext">Nova grade</button><button class="ghost" data-act="localend">Ver resultado final</button></div></div>`:"";
  return `<div class="tv ${wide?"wide":""}">
    <div class="tvtop">${K.backBtn(armed)}<span class="label">${K.esc(LS.theme)} · ${LEVELS[LS.level]} · grade ${LS.round}</span>${K.fsBtn()}</div>
    <div class="tvbody">
      <div class="boardcol center">${boardHTML(g.size,g.cells,cs,lines,{interactive:true,pend:pending})}<p class="hint center">Arraste da primeira à última letra, ou toque na primeira e depois na última.</p></div>
      <div class="side">
        ${K.scoreList(LS.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score))}
        ${lastBar(lw?{w:lw.w,clue:lw.clue,ref:lw.ref,team:LS.teams[lw.by].name,color:LS.teams[lw.by].color}:null)}
        ${wordChips(g.words,w=>w.by!==null?LS.teams[w.by].color:"")}
        <div class="tools"><button class="mini-btn" data-act="localnext">Nova grade</button><button class="mini-btn" data-act="localend">Encerrar</button></div>
      </div>
    </div>${picker}${done}</div>`;
}
function vLocalEnd(){return K.finalView(LS.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score),{armed,againAct:"localagain",closeAct:"home"})}
function vLobby(){
  return K.lobby({code:HS.code,url:location.href.split(/[?#]/)[0]+"?ctv="+HS.code,title:`${GAME} · ${HS.theme} · ${LEVELS[HS.level]}`,
    teams:HS.order.map(id=>({id,...HS.teams[id]})),online:id=>room&&room.online(id),net:room?room.net:"off",armed,startLabel:"Começar"});
}
function vHost(){
  const g=HS.grid,cs=tvCell(g.size),wide=window.innerWidth>=900;
  const lines=g.words.filter(w=>w.by).map(w=>({a:[w.r,w.c],b:endOf(w),color:HS.teams[w.by].color}));
  const lw=HS.last?g.words[HS.last.i]:null, lt=HS.last?HS.teams[HS.last.tid]:null;
  const done=HS.status==="done"?`<div class="overlay"><div class="pickbox"><span class="label">Grade completa</span><p class="word sm">Todas achadas!</p>
    ${K.scoreList(K.ranking(HS.teams,HS.order))}
    <button class="cta" data-act="hostnext">Nova grade</button><button class="ghost" data-act="hostend">Ver resultado final</button></div></div>`:"";
  return `<div class="tv ${wide?"wide":""}">
    <div class="tvtop">${K.backBtn(armed)}<span class="label">${K.esc(HS.theme)} · ${LEVELS[HS.level]} · grade ${HS.round}</span>${K.fsBtn()}</div>
    ${K.netLine(room?room.net:"off")}
    <div class="tvbody">
      <div class="boardcol center">${boardHTML(g.size,g.cells,cs,lines)}</div>
      <div class="side">
        ${K.scoreList(K.ranking(HS.teams,HS.order))}
        ${lastBar(lw?{w:lw.w,clue:lw.clue,ref:lw.ref,team:lt.name,color:lt.color}:null)}
        ${wordChips(g.words,w=>w.by?HS.teams[w.by].color:"")}
        <div class="tools"><button class="mini-btn" data-act="hostnext">Nova grade</button><button class="mini-btn" data-act="hostend">Encerrar</button></div>
        <p class="hint">Para entrar agora: ${K.esc((location.href.split(/[?#]/)[0]+"?ctv="+HS.code).replace(/^https?:\/\//,""))}</p>
      </div>
    </div>${done}</div>`;
}
function vHostEnd(){return K.finalView(K.ranking(HS.teams,HS.order),{armed,againAct:"hostagain",closeAct:"hostclose",closeLabel:"Fechar a sala"})}
function vTeamLobby(){return `<div class="col">${K.teamHead(T.st,link.net,armed)}<div class="center-box"><span class="label">Vocês estão na sala!</span><p class="word sm">Olhem para o telão</p><p class="hint">O jogo começa quando o telão iniciar.</p></div></div>`}
function vTeam(){
  const s=T.st,cs=phoneCell(s.size);
  const lines=s.words.filter(w=>w.line).map(w=>({a:[w.line[0],w.line[1]],b:[w.line[2],w.line[3]],color:w.color}));
  const mine=s.words.filter(w=>w.mine).length, left=s.words.filter(w=>!w.color).length;
  return `<div class="col">${K.teamHead(s,link.net,armed)}
    <div class="prompt">${s.status==="done"?"Grade completa! Olhem o telão.":`Faltam ${left} · vocês acharam ${mine}`}</div>
    <div class="stage">${boardHTML(s.size,s.cells,cs,lines,{interactive:s.status==="play",pend:pending})}</div>
    ${lastBar(s.last)}
    ${wordChips(s.words,w=>w.color||"")}
  </div>`;
}

/* ---------- toque na grade (telão e celular) ---------- */
function cellFrom(e){const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest("#cacatv .wsboard.touch .lt");return c?[+c.dataset.r,+c.dataset.c]:null}
function sizeNow(){return view==="l-play"?LS.grid.size:T&&T.st?T.st.size:0}
function cellPx(){return view==="l-play"?tvCell(LS.grid.size):phoneCell(T.st.size)}
function drawDrag(){
  const svg=ROOT.querySelector("#ct-svg");if(!svg)return;
  svg.querySelectorAll(".drag").forEach(x=>x.remove());
  if(drag){svg.insertAdjacentHTML("beforeend",linesSVG([{a:drag.a,b:drag.b,color:"var(--sel)",op:.6}],cellPx()).replace("<line ","<line class=\"drag\" "))}
}
ROOT.addEventListener("pointerdown",e=>{
  if(!(view==="l-play"&&LS.status==="play"&&!pick)&&!(view==="t-play"&&T.st.status==="play")) return;
  const p=cellFrom(e);if(!p)return;e.preventDefault();
  drag={a:p,b:p,id:e.pointerId};try{ROOT.querySelector("#ct-board").setPointerCapture(e.pointerId)}catch(_){}
  drawDrag();
});
ROOT.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id)return;const p=cellFrom(e);if(!p)return;
  const b=snap(drag.a,p[0],p[1],sizeNow());if(b[0]!==drag.b[0]||b[1]!==drag.b[1]){drag.b=b;drawDrag()}
});
ROOT.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!==drag.id)return;
  let {a,b}=drag;drag=null;
  if(a[0]===b[0]&&a[1]===b[1]){
    if(pending&&(pending[0]!==a[0]||pending[1]!==a[1])){b=snap(pending,a[0],a[1],sizeNow());a=pending;pending=null}
    else{pending=pending?null:a;render();return}
  } else pending=null;
  select(a,b);
});
ROOT.addEventListener("pointercancel",()=>{drag=null;drawDrag()});
function shakeBoard(){const b=ROOT.querySelector("#ct-board");if(b){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}}
function select(a,b){
  if(view==="l-play"){
    const i=matchIn(LS.grid.words,a,b);
    if(i<0){render();shakeBoard();return}
    if(LS.grid.words[i].by!==null){K.toast("Essa palavra já foi achada");render();return}
    pick={wi:i};render();
  } else if(view==="t-play"){
    render();
    if(!link.send({t:"pick",round:T.st.round,a,b})) K.toast("Sem conexão com o telão");
  }
}

/* ---------- celular: estado vindo da TV ---------- */
function onTeamState(m){
  if(m.t==="msg"){
    if(m.kind==="taken") K.toast(m.by?`${m.by} achou essa antes!`:"Outra equipe achou antes!");
    else if(m.kind==="miss"){shakeBoard()}
    return;
  }
  if(m.t!=="state") return;
  const prev=T.st;T.st=m;
  if(prev&&prev.round!==m.round){pending=null}
  if(prev&&m.score>prev.score) K.toast("Achou! +1 ponto");
  view=m.status==="lobby"?"t-lobby":m.status==="end"?"t-end":"t-"+m.status;
  K.keepAwake();render();
}

/* ---------- ações ---------- */
function act(x,v){
  if(x!=="back") armed=false;
  switch(x){
    case "tocaca": HUB.go("caca"); break;
    case "home": if(view==="teams")cfg.teams=K.readTeams(ROOT,cfg.teams); view="home"; save(); render(); break;
    case "theme": cfg.theme=v; save(); render(); break;
    case "level": cfg.level=v; save(); render(); break;
    case "local": view="teams"; render(); break;
    case "addteam": cfg.teams=K.readTeams(ROOT,cfg.teams); if(cfg.teams.length<6)cfg.teams.push(`Equipe ${cfg.teams.length+1}`); render(); break;
    case "delteam": cfg.teams=K.readTeams(ROOT,cfg.teams); cfg.teams.splice(+v,1); render(); break;
    case "startlocal": cfg.teams=K.readTeams(ROOT,cfg.teams); localStart(); view="l-play"; save(); K.keepAwake(); render(); break;
    case "resumeL": view=LS.status==="end"?"l-end":"l-play"; K.keepAwake(); render(); break;
    case "claim": if(pick){localClaim(pick.wi,+v);pick=null;save();render()} break;
    case "cancelpick": pick=null; render(); break;
    case "localnext": LS.round++; LS.grid=gen(LS.theme,LS.level); LS.last=-1; LS.status="play"; pending=null; save(); render(); break;
    case "localend": LS.status="end"; view="l-end"; save(); render(); break;
    case "localagain": LS.teams.forEach(t=>t.score=0); LS.round=1; LS.grid=gen(LS.theme,LS.level); LS.last=-1; LS.status="play"; view="l-play"; save(); render(); break;
    case "fs": K.toggleFs(); setTimeout(render,300); break;
    case "host": hostCreate(); view="h-lobby"; openRoom(); save(); K.keepAwake(); render(); break;
    case "resumeH": view=HS.status==="lobby"?"h-lobby":"h-"+HS.status; openRoom(); K.keepAwake(); render(); break;
    case "hoststart": hostRound(); view="h-play"; save(); sendAll(); render(); break;
    case "hostnext": hostRound(); view="h-play"; save(); sendAll(); render(); break;
    case "hostend": HS.status="end"; view="h-end"; save(); sendAll(); render(); break;
    case "hostagain": for(const id of HS.order)HS.teams[id].score=0; HS.round=0; hostRound(); view="h-play"; save(); sendAll(); render(); break;
    case "hostclose": if(room){room.close();room=null} HS=null; save(); view="home"; render(); break;
    case "teamjoin":{
      const name=(ROOT.querySelector("#tk-name")||{}).value||"";
      if(!name.trim()){K.toast("Escreva o nome da equipe");return}
      T.name=name.trim().slice(0,20);K.put(TEAMSAVE,{code:T.code,tid:T.tid,name:T.name});
      view="t-wait";openLink();K.keepAwake();render();break;}
    case "teamcancel": if(link){link.close();link=null} T=null; K.clearParam(); view="home"; HUB.go("hub"); break;
    case "retry": if(link)link.retry(); else if(room)room.retry(); break;
    case "back":
      if(!armed){armed=true;render();setTimeout(()=>{if(armed){armed=false;render()}},3000);break}
      armed=false;
      if(view.startsWith("t-")){act("teamcancel");break}
      if(view.startsWith("h-")){if(room){room.close();room=null}}
      pick=null;view="home";render();break;
  }
}
function openRoom(){if(room)room.close();room=K.host({prefix:PREFIX,code:HS.code,onData:onHostData,onChange:()=>{if(room&&HS&&room.code!==HS.code){HS.code=room.code;save()}if(view.startsWith("h-"))render()},canRecode:()=>HS&&HS.status==="lobby"&&!HS.order.length})}
function openLink(){if(link)link.close();link=K.team({prefix:PREFIX,code:T.code,tid:T.tid,name:T.name,onState:onTeamState,onChange:()=>{if(view==="t-wait"||view.startsWith("t-"))render()}})}
ROOT.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(a)act(a.dataset.act,a.dataset.v)});
ROOT.addEventListener("keydown",e=>{if(e.target.id==="tk-name"&&e.key==="Enter"){e.preventDefault();act("teamjoin")}});
document.addEventListener("visibilitychange",()=>{if(HUB.active!=="cacatv"||document.visibilityState!=="visible")return;if(link)link.revive();if(room)room.revive();K.keepAwake()});
window.addEventListener("resize",()=>{if(HUB.active==="cacatv"&&/play|done/.test(view))render()});

return {
  mount(){
    if(!booted){
      booted=true;
      const s=K.get(SAVE);if(s){if(s.cfg)cfg=Object.assign(cfg,s.cfg);if(s.LS&&s.LS.grid)LS=s.LS;if(s.HS&&s.HS.code)HS=s.HS}
      const code=K.norm(new URLSearchParams(location.search).get("ctv")).slice(0,5);
      if(code.length===5){
        const p=K.get(TEAMSAVE);
        T={code,tid:(p&&p.tid)||K.genId(),name:(p&&p.code===code&&p.name)||(p&&p.name)||"",st:null};
        if(p&&p.code===code&&p.name){view="t-wait";openLink();render();return}
        view="t-join";
      }
    }
    render();
  },
  unmount(){},
  _test:{localStart,localClaim,hostCreate,hostJoin,hostRound,hostPick,teamView,get LS(){return LS},get HS(){return HS},set cfg(v){cfg=v},
    show(v){view=v;render()},team(m){T={code:"ABCDE",tid:"x",name:m.name,st:null};link={net:"online",send(){return true},close(){},revive(){}};onTeamState(m)}}
};
})();

</script>
<script>
window.GAMES=window.GAMES||{};
GAMES.cruztv=(function(){
const K=TVKIT, ROOT=document.getElementById("cruztv");
const SAVE="cruztv-v1", TEAMSAVE="cruztv-equipe-v1", PREFIX="cruz-telao-lgda-", GAME="Cruzadinha no Telão";
const ALL="Tudo misturado", THEMES=Object.keys(DICAS);
const SIZES={pequena:{n:6,label:"Pequena"},media:{n:9,label:"Média"},grande:{n:12,label:"Grande"}};
let view="home", booted=false, armed=false, kbOn=null;
let cfg={theme:THEMES[0],size:"media",teams:["Equipe 1","Equipe 2"]};
let LS=null, HS=null, T=null, room=null, link=null, cur="", pick=null, sel=0, pendingAns=false;

function save(){K.put(SAVE,{cfg,LS,HS})}
function newPuzzle(theme,size){
  const G=GAMES.cruz.gen, p=G.buildPuzzle(G.entriesFor(theme),SIZES[size].n);
  p.words.forEach(w=>w.by=null);return p;
}
const cellsOf=w=>Array.from({length:w.g.length},(_,i)=>[w.r+(w.dir==="V"?i:0),w.c+(w.dir==="H"?i:0)]);
const dirName=d=>d==="H"?"horizontal":"vertical";

/* ---------- regras: só telão ---------- */
function localStart(){
  LS={teams:cfg.teams.map((n,i)=>({name:n.trim()||`Equipe ${i+1}`,color:K.COLORS[i%K.COLORS.length],score:0})),theme:cfg.theme,size:cfg.size,round:1,puz:newPuzzle(cfg.theme,cfg.size),last:-1,status:"play"};
  sel=0;cur="";
}
function localCheck(i,w){return K.norm(w)===LS.puz.words[i].g}
function localClaim(i,team){
  const w=LS.puz.words[i];if(w.by!==null)return;
  w.by=team;if(team>=0)LS.teams[team].score++;LS.last=i;
  if(LS.puz.words.every(x=>x.by!==null)) LS.status="done";
}

/* ---------- regras: telão + celulares ---------- */
function hostCreate(){HS={code:K.genCode(),theme:cfg.theme,size:cfg.size,round:0,status:"lobby",teams:{},order:[],puz:null,last:null}}
function hostJoin(tid,name){
  if(!HS.teams[tid]){HS.teams[tid]={name,color:K.COLORS[HS.order.length%K.COLORS.length],score:0,cool:0};HS.order.push(tid);return true}
  HS.teams[tid].name=name;return false;
}
function hostRound(){HS.round++;HS.puz=newPuzzle(HS.theme,HS.size);HS.status="play";HS.last=null;for(const id of HS.order)HS.teams[id].cool=0}
// Retorna ok, wrong, wait (esperar depois de errar), taken ou late.
function hostAnswer(tid,round,i,w,now=Date.now()){
  const t=HS.teams[tid];
  if(!t||HS.status!=="play"||round!==HS.round) return {r:"late"};
  const word=HS.puz.words[i];if(!word) return {r:"late"};
  if(word.by) return {r:"taken",by:HS.teams[word.by]?HS.teams[word.by].name:""};
  if(now<t.cool) return {r:"wait",ms:t.cool-now};
  if(K.norm(w)!==word.g){t.cool=now+3000;return {r:"wrong"}}
  word.by=tid;t.score++;HS.last={i,tid};
  if(HS.puz.words.every(x=>x.by)) HS.status="done";
  return {r:"ok"};
}
function teamView(tid){
  const t=HS.teams[tid];if(!t) return null;
  const p=HS.puz,lw=HS.last&&p?p.words[HS.last.i]:null;
  return {t:"state",status:HS.status,round:HS.round,name:t.name,color:t.color,score:t.score,
    rows:p?p.rows:0,cols:p?p.cols:0,
    words:p?p.words.map(w=>({num:w.num,dir:w.dir,len:w.g.length,clue:w.clue,ref:w.ref,r:w.r,c:w.c,
      g:w.by?w.g:null,color:w.by?HS.teams[w.by].color:null,mine:w.by===tid})):[],
    last:lw?{w:lw.w,clue:lw.clue,ref:lw.ref,team:HS.teams[HS.last.tid].name,color:HS.teams[HS.last.tid].color}:null,
    board:K.ranking(HS.teams,HS.order,tid).map(x=>({name:x.name,color:x.color,score:x.score,me:x.me}))};
}
function sendAll(){if(room&&HS)for(const id of HS.order)room.sendTo(id,teamView(id))}
function onHostData(c,m){
  if(!HS) return;
  if(m.t==="hello"){
    const tid=String(m.tid||"").slice(0,40),name=String(m.name||"").trim().slice(0,20)||"Equipe";if(!tid)return;
    c.tid=tid;if(hostJoin(tid,name))K.toast(`${name} entrou`);save();sendAll();render();return;
  }
  if(!c.tid) return;
  if(m.t==="sync"){room.sendTo(c.tid,teamView(c.tid));return}
  if(m.t==="answer"){
    const r=hostAnswer(c.tid,m.round,+m.i,String(m.w||""));
    if(r.r==="ok"){const w=HS.puz.words[+m.i];K.toast(`${HS.teams[c.tid].name} acertou ${w.w.toUpperCase()}`);save();sendAll();render()}
    else room.sendTo(c.tid,{t:"msg",kind:r.r,by:r.by||"",ms:r.ms||0});
  }
}

/* ---------- desenho da grade ---------- */
// words: lista com r,c,dir,len,num e, quando resolvida, g e color.
function gridHTML(rows,cols,words,cs,{selIdx=-1,clickable=false}={}){
  const map={},nums={};
  words.forEach((w,wi)=>{
    nums[w.r+","+w.c]=w.num;
    for(let i=0;i<w.len;i++){
      const k=(w.r+(w.dir==="V"?i:0))+","+(w.c+(w.dir==="H"?i:0));
      const x=map[k]||(map[k]={ch:"",color:"",inSel:false});
      if(w.g&&!x.ch){x.ch=w.g[i];x.color=w.color}
      if(wi===selIdx)x.inSel=true;
    }
  });
  let h="";
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const k=r+","+c,x=map[k];
    if(!x){h+=`<div class="xc"></div>`;continue}
    h+=`<div class="xc on ${x.inSel?"sel":""} ${x.ch?"solved":""}" ${clickable?`data-cell="${k}"`:""} style="${x.color?`--c:${x.color};`:""}">${nums[k]?`<span class="num">${nums[k]}</span>`:""}${x.ch}</div>`;
  }
  return `<div class="xgrid" style="grid-template-columns:repeat(${cols},${cs}px);grid-auto-rows:${cs}px;font-size:${Math.round(cs*.55)}px">${h}</div>`;
}
function localWords(){return LS.puz.words.map(w=>({num:w.num,dir:w.dir,len:w.g.length,r:w.r,c:w.c,g:w.by!==null?w.g:null,color:w.by===null?null:w.by>=0?LS.teams[w.by].color:"var(--absent)",clue:w.clue,ref:w.ref}))}
function hostWords(){return HS.puz.words.map(w=>({num:w.num,dir:w.dir,len:w.g.length,r:w.r,c:w.c,g:w.by?w.g:null,color:w.by?HS.teams[w.by].color:null,clue:w.clue,ref:w.ref}))}
function tvCell(rows,cols,wide){return Math.max(20,Math.min(64,Math.floor(Math.min((window.innerHeight-140)/rows,(Math.min(window.innerWidth,1500)*(wide?0.55:1)-40)/cols))))}
function phoneCell(rows,cols){return Math.max(14,Math.min(30,Math.floor(Math.min((Math.min(window.innerWidth,560)-40)/cols,(window.innerHeight-430)/rows))))}
function clueList(words,{selIdx=-1,clickable=false}={}){
  const item=(w,i)=>`<li><button ${clickable?`data-act="selw" data-v="${i}"`:"disabled"} class="${i===selIdx?"cur":""} ${w.g?"done":""}" style="${w.color?`--c:${w.color}`:""}"><b>${w.num}</b><span>${K.esc(w.clue)}${w.ref?` <em>(${K.esc(w.ref)})</em>`:""}${w.g?` <strong>${K.esc(w.g)}</strong>`:""}</span></button></li>`;
  const H=[],V=[];words.forEach((w,i)=>(w.dir==="H"?H:V).push(item(w,i)));
  return `<div class="clues">${H.length?`<span class="label">Horizontais</span><ol>${H.join("")}</ol>`:""}${V.length?`<span class="label">Verticais</span><ol>${V.join("")}</ol>`:""}</div>`;
}
function answerRow(len,cs){
  let h="";for(let i=0;i<len;i++)h+=`<div class="tile ${cur[i]?"filled":""} ${i===cur.length?"cursor":""}">${K.esc(cur[i]||"")}</div>`;
  return `<div class="answer" data-active style="--ts:${cs}px"><div class="row" style="--n:${len}">${h}</div></div>`;
}
function lastBar(l){return l?`<div class="lastbar" style="--c:${l.color}"><b>${K.esc(l.w.toUpperCase())}</b> ${K.esc(l.clue)} ${l.ref?`<em>(${K.esc(l.ref)})</em>`:""}<small>${K.esc(l.team)}</small></div>`:""}

/* ---------- telas ---------- */
function render(){
  if(HS&&view.startsWith("h-")&&view!=="h-lobby"&&view!=="h-"+HS.status) view="h-"+HS.status;
  const v={home:vHome,teams:()=>K.teamsSetup(cfg.teams,"home"),"l-play":vLocal,"l-end":vLocalEnd,
    "h-lobby":vLobby,"h-play":vHost,"h-done":vHost,"h-end":vHostEnd,
    "t-join":()=>K.joinView(GAME,T.code,T.name),"t-wait":()=>K.waitView(T.code,link?link.net:"connecting"),"t-lobby":vTeamLobby,"t-play":vTeam,"t-done":vTeam,"t-end":()=>K.teamEndView(T.st,armed)}[view]||vHome;
  ROOT.innerHTML=v();
  if(view==="h-lobby") K.drawQR(ROOT);
}
function vHome(){
  const t=n=>`<button class="theme" data-act="theme" data-v="${K.esc(n)}" aria-pressed="${cfg.theme===n}">${K.esc(n)}</button>`;
  return `<div class="scroll narrow">
    <button class="tohub" data-act="tocruz">← Cruzadinha</button>
    <div class="hero"><h1 class="brand">Cruzadinha no Telão<span>Equipes disputam quem acerta mais palavras.</span></h1></div>
    ${LS&&LS.status!=="end"?`<button class="cta resume" data-act="resumeL">Continuar partida no telão</button>`:""}
    ${HS&&HS.status!=="end"?`<button class="cta resume" data-act="resumeH">Voltar para a sala ${K.esc(HS.code)}</button>`:""}
    <div class="field"><span class="label">Tema</span><div class="themes">${THEMES.map(t).join("")}${t(ALL)}</div></div>
    <div class="field"><span class="label">Tamanho</span><div class="seg3">${Object.entries(SIZES).map(([k,v])=>`<button data-act="size" data-v="${k}" aria-pressed="${cfg.size===k}">${v.label}<small>${v.n} palavras</small></button>`).join("")}</div></div>
    <div class="modes">
      <button class="mode" data-act="local"><b>Só o telão</b><span>A grade grande na TV. As equipes respondem em voz alta, quem comanda digita a palavra e toca na equipe que acertou. Não precisa de internet.</span></button>
      <button class="mode" data-act="host"><b>Telão + celulares</b><span>Cada equipe responde as dicas no celular. A primeira que acertar fica com a palavra, e a TV pinta a grade com a cor dela.</span></button>
    </div>
  </div>`;
}
function vLocal(){
  const wide=window.innerWidth>=900,p=LS.puz,cs=tvCell(p.rows,p.cols,wide),w=p.words[sel],words=localWords();
  const useKb=kbOn===null?(matchMedia("(pointer:coarse)").matches||!wide):kbOn;
  const lw=LS.last>=0?p.words[LS.last]:null;
  const picker=pick?`<div class="overlay"><div class="pickbox"><span class="label">Quem acertou</span><p class="word sm">${K.esc(p.words[pick.i].w.toUpperCase())}</p>
    <div class="pickteams">${LS.teams.map((t,i)=>`<button class="pt" style="--c:${t.color}" data-act="claim" data-v="${i}">${K.esc(t.name)}</button>`).join("")}</div>
    <button class="ghost" data-act="cancelpick">Cancelar</button></div></div>`:"";
  const done=LS.status==="done"?`<div class="overlay"><div class="pickbox"><span class="label">Cruzadinha completa</span><p class="word sm">Parabéns!</p>
    ${K.scoreList(LS.teams.slice().sort((a,b)=>b.score-a.score))}
    <button class="cta" data-act="localnext">Nova cruzadinha</button><button class="ghost" data-act="localend">Ver resultado final</button></div></div>`:"";
  const solved=w.by!==null;
  return `<div class="tv ${wide?"wide":""}">
    <div class="tvtop">${K.backBtn(armed)}<span class="label">${K.esc(LS.theme)} · cruzadinha ${LS.round}</span>${K.fsBtn()}</div>
    <div class="tvbody">
      <div class="boardcol center">${gridHTML(p.rows,p.cols,words,cs,{selIdx:sel,clickable:true})}</div>
      <div class="side">
        ${K.scoreList(LS.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score))}
        <div class="cluebox"><small>${w.num} ${dirName(w.dir)} · ${w.g.length} letras</small>${K.esc(w.clue)} ${w.ref?`<em>(${K.esc(w.ref)})</em>`:""}</div>
        ${solved?`<p class="hint">Esta já foi respondida. Escolha outra dica.</p>`:answerRow(w.g.length,Math.min(52,Math.floor(340/w.g.length)))}
        ${!solved&&useKb?K.keyboard(true):""}
        <div class="tools"><button class="mini-btn" data-act="prevw">‹ Dica anterior</button><button class="mini-btn" data-act="nextw">Próxima dica ›</button>
          ${solved?"":`<button class="mini-btn" data-act="revealw">Revelar palavra</button>`}<button class="mini-btn" data-act="kb">${useKb?"Esconder teclado":"Teclado na tela"}</button>
          <button class="mini-btn" data-act="localnext">Nova cruzadinha</button><button class="mini-btn" data-act="localend">Encerrar</button></div>
        ${lastBar(lw&&lw.by>=0?{w:lw.w,clue:lw.clue,ref:lw.ref,team:LS.teams[lw.by].name,color:LS.teams[lw.by].color}:null)}
        ${clueList(words,{selIdx:sel,clickable:true})}
      </div>
    </div>${picker}${done}</div>`;
}
function vLocalEnd(){return K.finalView(LS.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score),{armed,againAct:"localagain",closeAct:"home"})}
function vLobby(){
  return K.lobby({code:HS.code,url:location.href.split(/[?#]/)[0]+"?xtv="+HS.code,title:`${GAME} · ${HS.theme} · ${SIZES[HS.size].label}`,
    teams:HS.order.map(id=>({id,...HS.teams[id]})),online:id=>room&&room.online(id),net:room?room.net:"off",armed});
}
function vHost(){
  const wide=window.innerWidth>=900,p=HS.puz,cs=tvCell(p.rows,p.cols,wide),words=hostWords();
  const lw=HS.last?p.words[HS.last.i]:null,lt=HS.last?HS.teams[HS.last.tid]:null;
  const done=HS.status==="done"?`<div class="overlay"><div class="pickbox"><span class="label">Cruzadinha completa</span><p class="word sm">Parabéns!</p>
    ${K.scoreList(K.ranking(HS.teams,HS.order))}
    <button class="cta" data-act="hostnext">Nova cruzadinha</button><button class="ghost" data-act="hostend">Ver resultado final</button></div></div>`:"";
  return `<div class="tv ${wide?"wide":""}">
    <div class="tvtop">${K.backBtn(armed)}<span class="label">${K.esc(HS.theme)} · cruzadinha ${HS.round} · ${words.filter(w=>w.g).length}/${words.length}</span>${K.fsBtn()}</div>
    ${K.netLine(room?room.net:"off")}
    <div class="tvbody">
      <div class="boardcol center">${gridHTML(p.rows,p.cols,words,cs)}</div>
      <div class="side">
        ${K.scoreList(K.ranking(HS.teams,HS.order))}
        ${lastBar(lw?{w:lw.w,clue:lw.clue,ref:lw.ref,team:lt.name,color:lt.color}:null)}
        ${clueList(words)}
        <div class="tools"><button class="mini-btn" data-act="hostnext">Nova cruzadinha</button><button class="mini-btn" data-act="hostend">Encerrar</button></div>
        <p class="hint">Para entrar agora: ${K.esc((location.href.split(/[?#]/)[0]+"?xtv="+HS.code).replace(/^https?:\/\//,""))}</p>
      </div>
    </div>${done}</div>`;
}
function vHostEnd(){return K.finalView(K.ranking(HS.teams,HS.order),{armed,againAct:"hostagain",closeAct:"hostclose",closeLabel:"Fechar a sala"})}
function vTeamLobby(){return `<div class="col">${K.teamHead(T.st,link.net,armed)}<div class="center-box"><span class="label">Vocês estão na sala!</span><p class="word sm">Olhem para o telão</p><p class="hint">O jogo começa quando o telão iniciar.</p></div></div>`}
function vTeam(){
  const s=T.st,cs=phoneCell(s.rows,s.cols);
  if(!s.words[sel]||s.words[sel].g){const i=s.words.findIndex(w=>!w.g);if(i>=0)sel=i}
  const w=s.words[sel],open=s.status==="play"&&w&&!w.g;
  const left=s.words.filter(x=>!x.g).length;
  return `<div class="col">${K.teamHead(s,link.net,armed)}
    <div class="stage">${gridHTML(s.rows,s.cols,s.words,cs,{selIdx:open?sel:-1,clickable:true})}</div>
    ${s.status==="done"||!left?`<div class="center-box"><p class="word sm">Cruzadinha completa!</p><p class="hint">Olhem o telão.</p></div>`:`
    <div class="cluebar"><button data-act="prevw" aria-label="Dica anterior">‹</button>
      <div class="clue"><small>${w.num} ${dirName(w.dir)} · ${w.len} letras · faltam ${left}</small>${K.esc(w.clue)} ${w.ref?`<em>(${K.esc(w.ref)})</em>`:""}</div>
      <button data-act="nextw" aria-label="Próxima dica">›</button></div>
    ${answerRow(w.len,Math.min(44,Math.floor((Math.min(window.innerWidth,560)-40)/w.len)-6))}
    ${K.keyboard(open&&!pendingAns&&!!link.conn)}`}
  </div>`;
}

/* ---------- digitação ---------- */
function curLen(){
  if(view==="l-play"){const w=LS.puz.words[sel];return w.by===null?w.g.length:0}
  if(view==="t-play"){const w=T.st.words[sel];return w&&!w.g&&T.st.status==="play"&&!pendingAns?w.len:0}
  return 0;
}
function press(k){
  if(pick) return;
  const n=curLen();if(!n) return;
  if(k==="BACK"){cur=cur.slice(0,-1);render();return}
  if(k==="ENTER"){
    if(cur.length<n){shake();K.toast(`A resposta tem ${n} letras`);return}
    if(view==="l-play"){
      if(localCheck(sel,cur)){pick={i:sel};cur="";render()}
      else{shake();K.toast("Não é essa");}
    } else {
      pendingAns=true;
      if(!link.send({t:"answer",round:T.st.round,i:sel,w:cur})){pendingAns=false;K.toast("Sem conexão com o telão");return}
      render();setTimeout(()=>{if(pendingAns){pendingAns=false;render()}},4000);
    }
    return;
  }
  if(/^[A-Z]$/.test(k)&&cur.length<n){cur+=k;render()}
}
function shake(){const r=ROOT.querySelector("[data-active]");if(r){r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake")}}
function wordsNow(){return view==="l-play"?LS.puz.words.map(w=>({...w,len:w.g.length,g:w.by!==null?w.g:null})):T.st.words}
function moveSel(d){const ws=wordsNow();for(let k=1;k<=ws.length;k++){const i=(sel+d*k+ws.length*k)%ws.length;if(!ws[i].g){sel=i;break}}cur=""}
function tapCell(key){
  const [r,c]=key.split(",").map(Number),ws=wordsNow();
  const hits=ws.map((w,i)=>({w,i})).filter(({w})=>Array.from({length:w.len},(_,j)=>[w.r+(w.dir==="V"?j:0),w.c+(w.dir==="H"?j:0)]).some(([a,b])=>a===r&&b===c));
  if(!hits.length) return;
  const open=hits.filter(h=>!h.w.g), list=open.length?open:hits;
  const k=list.findIndex(h=>h.i===sel);
  sel=list[(k+1)%list.length].i;cur="";render();
}

/* ---------- celular: estado vindo da TV ---------- */
function onTeamState(m){
  if(m.t==="msg"){
    pendingAns=false;
    if(m.kind==="wrong"){shake();K.toast("Não é essa. Esperem 3 segundos.");cur=""}
    else if(m.kind==="wait"){K.toast("Esperem um pouquinho para tentar de novo")}
    else if(m.kind==="taken"){K.toast(m.by?`${m.by} acertou essa antes!`:"Outra equipe acertou antes!");cur=""}
    render();return;
  }
  if(m.t!=="state") return;
  const prev=T.st;T.st=m;
  if(prev&&prev.round!==m.round){sel=0;cur=""}
  if(prev&&m.score>prev.score){K.toast("Acertaram! +1 ponto");cur=""}
  if(prev&&prev.words[sel]&&!prev.words[sel].g&&m.words[sel]&&m.words[sel].g) cur="";
  pendingAns=false;
  view=m.status==="lobby"?"t-lobby":m.status==="end"?"t-end":"t-"+m.status;
  K.keepAwake();render();
}

/* ---------- ações ---------- */
function act(x,v){
  if(x!=="back") armed=false;
  switch(x){
    case "tocruz": HUB.go("cruz"); break;
    case "home": if(view==="teams")cfg.teams=K.readTeams(ROOT,cfg.teams); view="home"; save(); render(); break;
    case "theme": cfg.theme=v; save(); render(); break;
    case "size": cfg.size=v; save(); render(); break;
    case "local": view="teams"; render(); break;
    case "addteam": cfg.teams=K.readTeams(ROOT,cfg.teams); if(cfg.teams.length<6)cfg.teams.push(`Equipe ${cfg.teams.length+1}`); render(); break;
    case "delteam": cfg.teams=K.readTeams(ROOT,cfg.teams); cfg.teams.splice(+v,1); render(); break;
    case "startlocal": cfg.teams=K.readTeams(ROOT,cfg.teams); localStart(); view="l-play"; save(); K.keepAwake(); render(); break;
    case "resumeL": view=LS.status==="end"?"l-end":"l-play"; K.keepAwake(); render(); break;
    case "selw": sel=+v; cur=""; render(); break;
    case "prevw": moveSel(-1); render(); break;
    case "nextw": moveSel(1); render(); break;
    case "kb": kbOn=!(kbOn===null?(matchMedia("(pointer:coarse)").matches||window.innerWidth<900):kbOn); render(); break;
    case "claim": if(pick){localClaim(pick.i,+v);pick=null;if(LS.status==="play")moveSel(1);save();render()} break;
    case "cancelpick": pick=null; render(); break;
    case "revealw": if(LS.puz.words[sel].by===null){localClaim(sel,-1);cur="";if(LS.status==="play")moveSel(1);save();render()} break;
    case "localnext": LS.round++; LS.puz=newPuzzle(LS.theme,LS.size); LS.last=-1; LS.status="play"; sel=0; cur=""; save(); render(); break;
    case "localend": LS.status="end"; view="l-end"; save(); render(); break;
    case "localagain": LS.teams.forEach(t=>t.score=0); LS.round=1; LS.puz=newPuzzle(LS.theme,LS.size); LS.last=-1; LS.status="play"; sel=0; view="l-play"; save(); render(); break;
    case "fs": K.toggleFs(); setTimeout(render,300); break;
    case "host": hostCreate(); view="h-lobby"; openRoom(); save(); K.keepAwake(); render(); break;
    case "resumeH": view=HS.status==="lobby"?"h-lobby":"h-"+HS.status; openRoom(); K.keepAwake(); render(); break;
    case "hoststart": case "hostnext": hostRound(); view="h-play"; save(); sendAll(); render(); break;
    case "hostend": HS.status="end"; view="h-end"; save(); sendAll(); render(); break;
    case "hostagain": for(const id of HS.order)HS.teams[id].score=0; HS.round=0; hostRound(); view="h-play"; save(); sendAll(); render(); break;
    case "hostclose": if(room){room.close();room=null} HS=null; save(); view="home"; render(); break;
    case "teamjoin":{
      const name=(ROOT.querySelector("#tk-name")||{}).value||"";
      if(!name.trim()){K.toast("Escreva o nome da equipe");return}
      T.name=name.trim().slice(0,20);K.put(TEAMSAVE,{code:T.code,tid:T.tid,name:T.name});
      view="t-wait";openLink();K.keepAwake();render();break;}
    case "teamcancel": if(link){link.close();link=null} T=null; K.clearParam(); view="home"; HUB.go("hub"); break;
    case "retry": if(link)link.retry(); else if(room)room.retry(); break;
    case "back":
      if(!armed){armed=true;render();setTimeout(()=>{if(armed){armed=false;render()}},3000);break}
      armed=false;
      if(view.startsWith("t-")){act("teamcancel");break}
      if(view.startsWith("h-")){if(room){room.close();room=null}}
      pick=null;view="home";render();break;
  }
}
function openRoom(){if(room)room.close();room=K.host({prefix:PREFIX,code:HS.code,onData:onHostData,onChange:()=>{if(room&&HS&&room.code!==HS.code){HS.code=room.code;save()}if(view.startsWith("h-"))render()},canRecode:()=>HS&&HS.status==="lobby"&&!HS.order.length})}
function openLink(){if(link)link.close();link=K.team({prefix:PREFIX,code:T.code,tid:T.tid,name:T.name,onState:onTeamState,onChange:()=>{if(view.startsWith("t-"))render()}})}
ROOT.addEventListener("click",e=>{
  const k=e.target.closest("[data-k]");if(k){press(k.dataset.k);return}
  const c=e.target.closest("[data-cell]");if(c){tapCell(c.dataset.cell);return}
  const a=e.target.closest("[data-act]");if(a)act(a.dataset.act,a.dataset.v);
});
ROOT.addEventListener("keydown",e=>{if(e.target.id==="tk-name"&&e.key==="Enter"){e.preventDefault();act("teamjoin")}});
document.addEventListener("keydown",e=>{
  if(HUB.active!=="cruztv"||e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"){e.preventDefault();press("ENTER")}
  else if(e.key==="Backspace"){e.preventDefault();press("BACK")}
  else if(e.key==="ArrowRight"||e.key==="ArrowDown"){if(/l-play|t-play/.test(view)){e.preventDefault();moveSel(1);render()}}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){if(/l-play|t-play/.test(view)){e.preventDefault();moveSel(-1);render()}}
  else{const c=K.norm(e.key);if(c.length===1)press(c)}
});
document.addEventListener("visibilitychange",()=>{if(HUB.active!=="cruztv"||document.visibilityState!=="visible")return;if(link)link.revive();if(room)room.revive();K.keepAwake()});
window.addEventListener("resize",()=>{if(HUB.active==="cruztv"&&/play|done/.test(view))render()});

return {
  mount(){
    if(!booted){
      booted=true;
      const s=K.get(SAVE);if(s){if(s.cfg)cfg=Object.assign(cfg,s.cfg);if(s.LS&&s.LS.puz)LS=s.LS;if(s.HS&&s.HS.code)HS=s.HS}
      const code=K.norm(new URLSearchParams(location.search).get("xtv")).slice(0,5);
      if(code.length===5){
        const p=K.get(TEAMSAVE);
        T={code,tid:(p&&p.tid)||K.genId(),name:(p&&p.code===code&&p.name)||(p&&p.name)||"",st:null};
        if(p&&p.code===code&&p.name){view="t-wait";openLink();render();return}
        view="t-join";
      }
    }
    render();
  },
  unmount(){},
  _test:{localStart,localCheck,localClaim,hostCreate,hostJoin,hostRound,hostAnswer,teamView,get LS(){return LS},get HS(){return HS},set cfg(v){cfg=v},
    show(v){view=v;render()},team(m){T={code:"ABCDE",tid:"x",name:m.name,st:null};link={net:"online",conn:{},send(){return true},close(){},revive(){}};onTeamState(m)}}
};
})();

</script>
<script>
// Link do QR (?sala=) abre direto no Termo; senão, volta ao último jogo aberto.
(function(){
  const q=new URLSearchParams(location.search), sala=q.get("sala");
  if(q.get("tv")){HUB.go("telao");return}
  if(q.get("ctv")){HUB.go("cacatv");return}
  if(q.get("xtv")){HUB.go("cruztv");return}
  let last="hub";try{last=localStorage.getItem("jogos-ultimo")||"hub"}catch(e){}
  HUB.go(sala?"termo":(["termo","caca","cruz","telao","cacatv","cruztv"].includes(last)?last:"hub"));
})();
</script>
